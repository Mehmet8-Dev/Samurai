services:
  # Native Samurai CLI runner (interactive / one-shot).
  # Examples:
  #   docker compose --profile cli run --rm samurai samurai --list-profiles
  #   docker compose --profile cli run --rm samurai samurai --worker cpu --target 127.0.0.1 --port 80 --count 10000 --confirm
  samurai:
    image: samurai:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAMURAI_NATIVE_ARCH: "ON"
    container_name: samurai-cli
    profiles: ["cli"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "host"
    shm_size: "1gb"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./reports:/home/samurai/reports
    command: ["samurai", "--help"]
    stdin_open: true
    tty: true

  # 1-command reproducible 1M Userspace TCP Flow benchmark (605 B/flow, 64 shards).
  # Example:
  #   docker compose --profile bench run --rm bench
  bench:
    image: samurai:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAMURAI_NATIVE_ARCH: "ON"
    container_name: samurai-bench
    profiles: ["bench"]
    command: ["samurai_bench_1m_tcp"]
