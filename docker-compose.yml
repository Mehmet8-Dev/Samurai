services:
  # CLI runner (interactive). Example:
  # docker compose run --rm samurai --target 1.2.3.4 --port 80 --protocol udp --count 10000 --confirm --allow-public-target
  samurai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samurai-cli
    profiles: ["cli"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "host"
    shm_size: "1gb"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./reports:/app/reports
    command: ["--help"]
    stdin_open: true
    tty: true
