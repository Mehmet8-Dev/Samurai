<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="doca-dpu-title doca-dpu-desc">
  <title id="doca-dpu-title">Samurai DOCA GPUNetIO &amp; DPU-GPU Dataplane</title>
  <desc id="doca-dpu-desc">Architecture showing DPU flow-state authoritativeness and zero-copy GPUNetIO DMA between BlueField DPU and GPU GDDR6 VRAM.</desc>
  <style>
    text { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; }
    .bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    .t { fill: #1A1A1A; }
    .tm { fill: #4B4B4B; }
    .tw { fill: #FFFFFF; }
    .tk { fill: #000000; }
    .l { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; font-weight: 400; }
    .gl { font-size: 13px; font-weight: 600; }
    .k-nvke { fill: #76B900; }
    .k-nvkr { fill: #952FC6; }
    .k-nv { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    .k-tp { fill: #E0E0E0; }
    .k-hw { fill: #4B4B4B; }
    .k-actor { fill: #FFFFFF; stroke: #757575; stroke-width: 1.5; }
    .k-nvke-o { fill: #FFFFFF; stroke: #3F8500; stroke-width: 1.5; }
    .k-nvkr-o { fill: #FFFFFF; stroke: #952FC6; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .g { fill: none; stroke: #757575; stroke-width: 1.5; }
    .e { fill: none; stroke: #4B4B4B; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: #4B4B4B; }
    .ko { fill: #FFFFFF; }
    .ll { stroke: #A7A7A7; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .band { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .badge { fill: #F9C500; }
    .num { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1A1A; stroke: #313131; }
      .t { fill: #FFFFFF; }
      .tm { fill: #A7A7A7; }
      .k-nv { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-tp { fill: #313131; }
      .k-hw { fill: #757575; }
      .k-actor { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-nvke-o { fill: #1A1A1A; stroke: #76B900; }
      .k-nvkr-o { fill: #1A1A1A; stroke: #C359EF; }
      .g { stroke: #757575; }
      .e { stroke: #A7A7A7; }
      .ah { fill: #A7A7A7; }
      .ko { fill: #1A1A1A; }
      .ll { stroke: #757575; }
      .num { fill: #1A1A1A; stroke: #A7A7A7; }
    }
</style>
  
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M1,1.5 L9,5 L1,8.5 Z"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M9,1.5 L1,5 L9,8.5 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1119" height="619" rx="16"/>

  <!-- Top Banner -->
  <g class="node">
    <rect class="k-nvke" x="40" y="24" width="1040" height="52" rx="8"/>
    <text class="l tk" x="560" y="46" text-anchor="middle">Samurai DOCA GPUNetIO &amp; DPU-GPU Persistent Dataplane</text>
    <text class="s tk" x="560" y="64" text-anchor="middle">Hardware Flow-State Offload, Direct GPU VRAM DMA, and Line-Rate Carrier Packet Egress</text>
  </g>

  <!-- Left: Host Process & Control Plane Boundary -->
  <g class="group">
    <rect class="g" x="40" y="104" width="320" height="400" rx="12"/>
    <text class="gl tm" x="56" y="128">Host Process &amp; ZMQ Boundary</text>

    <g class="node">
      <rect class="k-nv" x="60" y="148" width="280" height="64" rx="8"/>
      <text class="l t" x="200" y="174" text-anchor="middle">samurai_doca_worker</text>
      <text class="s tm" x="200" y="192" text-anchor="middle">ZMQ Job Envelope V1 Receiver</text>
      <text class="s tm" x="200" y="206" text-anchor="middle">POSIX Daemon Lifecycle</text>
    </g>

    <g class="node">
      <rect class="k-nvke-o" x="60" y="228" width="280" height="64" rx="8"/>
      <text class="l t" x="200" y="254" text-anchor="middle">DOCA Backend Bridge</text>
      <text class="s tm" x="200" y="272" text-anchor="middle">Dynamic dlopen(libdoca_gpunetio.so)</text>
      <text class="s tm" x="200" y="286" text-anchor="middle">Fail-Fast Preflight Enforcement</text>
    </g>

    <g class="node">
      <rect class="k-nvkr" x="60" y="308" width="280" height="64" rx="8"/>
      <text class="l tw" x="200" y="334" text-anchor="middle">Dynamic Flow Control</text>
      <text class="s tw" x="200" y="352" text-anchor="middle">Retransmit, Zero-Window, Quotas</text>
      <text class="s tw" x="200" y="366" text-anchor="middle">Congestion Feedback Loop</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="60" y="388" width="280" height="96" rx="8"/>
      <text class="s t" x="200" y="412" text-anchor="middle">Hardware Preflight Verification</text>
      <text class="s tm" x="200" y="430" text-anchor="middle">SAMURAI_GPU_TX_BACKEND=doca_gpunetio</text>
      <text class="s tm" x="200" y="446" text-anchor="middle">SAMURAI_GPU_DOCA_DEVICE=mlx5_0</text>
      <text class="s tm" x="200" y="462" text-anchor="middle">Strict Fallback Prevention Active</text>
    </g>
  </g>

  <!-- Middle: BlueField DPU Authoritative State -->
  <g class="group">
    <rect class="g" x="400" y="104" width="320" height="400" rx="12"/>
    <text class="gl tm" x="416" y="128">BlueField DPU Authoritative State</text>

    <g class="node">
      <rect class="k-hw" x="420" y="148" width="280" height="64" rx="8"/>
      <text class="l tw" x="560" y="174" text-anchor="middle">dpu_state_runtime.hpp</text>
      <text class="s tw" x="560" y="192" text-anchor="middle">Hardware FlowStateTable</text>
      <text class="s tw" x="560" y="206" text-anchor="middle">100M+ Active Concurrent Contexts</text>
    </g>

    <g class="node">
      <rect class="k-nvkr" x="420" y="228" width="280" height="64" rx="8"/>
      <text class="l tw" x="560" y="254" text-anchor="middle">TCP FSM State Machine</text>
      <text class="s tw" x="560" y="272" text-anchor="middle">SYN-SENT, ESTABLISHED, FIN-WAIT</text>
      <text class="s tw" x="560" y="286" text-anchor="middle">Passive Open / Backlog Queue</text>
    </g>

    <g class="node">
      <rect class="k-nvke" x="420" y="308" width="280" height="64" rx="8"/>
      <text class="l tk" x="560" y="334" text-anchor="middle">Event Channels (Zero-Copy)</text>
      <text class="s tk" x="560" y="352" text-anchor="middle">FlowStreamUpsertV1 / FlowUpdateEventV1</text>
      <text class="s tk" x="560" y="366" text-anchor="middle">Nanosecond In-Memory Publishing</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="420" y="388" width="280" height="96" rx="8"/>
      <text class="s t" x="560" y="412" text-anchor="middle">Packet Processing Offloads</text>
      <text class="s tm" x="560" y="430" text-anchor="middle">IPv4/TCP Segment Parsing, SACK</text>
      <text class="s tm" x="560" y="446" text-anchor="middle">MSS, Window Scale, ECN Flagging</text>
      <text class="s tm" x="560" y="462" text-anchor="middle">Hardware Checksum Verification</text>
    </g>
  </g>

  <!-- Right: GPU Persistent Dataplane -->
  <g class="group">
    <rect class="g" x="760" y="104" width="320" height="400" rx="12"/>
    <text class="gl tm" x="776" y="128">GPU Persistent Dataplane</text>

    <g class="node">
      <rect class="k-nvke" x="780" y="148" width="280" height="64" rx="8"/>
      <text class="l tk" x="920" y="174" text-anchor="middle">samurai_gpu_worker</text>
      <text class="s tk" x="920" y="192" text-anchor="middle">Hot-Flow Policy Receiver</text>
      <text class="s tk" x="920" y="206" text-anchor="middle">Warp-Parallel Dynamic Streaming</text>
    </g>

    <g class="node">
      <rect class="k-nvke-o" x="780" y="228" width="280" height="64" rx="8"/>
      <text class="l t" x="920" y="254" text-anchor="middle">Vulkan / CUDA GDDR6 VRAM</text>
      <text class="s tm" x="920" y="272" text-anchor="middle">Packet Buffer Rings &amp; Payloads</text>
      <text class="s tm" x="920" y="286" text-anchor="middle">Host Memory Bypassed</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="780" y="308" width="280" height="64" rx="8"/>
      <text class="l tw" x="920" y="334" text-anchor="middle">GPUNetIO Direct DMA</text>
      <text class="s tw" x="920" y="352" text-anchor="middle">DPU NIC TX/RX Rings &lt;-&gt; GPU VRAM</text>
      <text class="s tw" x="920" y="366" text-anchor="middle">Zero-Copy PCIe P2P Access</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="780" y="388" width="280" height="96" rx="8"/>
      <text class="l tw" x="920" y="412" text-anchor="middle">Physical Wire Egress</text>
      <text class="s tw" x="920" y="430" text-anchor="middle">100GbE / 200GbE Carrier Links</text>
      <text class="s tw" x="920" y="446" text-anchor="middle">148.8 Mpps Full Line Rate</text>
      <text class="s tw" x="920" y="462" text-anchor="middle">Hardware Frame Checksum CRC32</text>
    </g>
  </g>

  <!-- Connectors -->
  <g class="edge">
    <path class="e" d="M340,180 L420,180" marker-end="url(#ah)"/>
    <rect class="ko" x="350" y="170" width="60" height="20" rx="4"/>
    <text class="s tm elabel" x="380" y="184" text-anchor="middle">Control</text>
  </g>
  <g class="edge">
    <path class="e" d="M700,340 L780,340" marker-end="url(#ah)"/>
    <rect class="ko" x="710" y="330" width="60" height="20" rx="4"/>
    <text class="s tm elabel" x="740" y="344" text-anchor="middle">Events</text>
  </g>
  <g class="edge">
    <path class="e dash" d="M780,360 L700,360" marker-end="url(#ah)"/>
    <rect class="ko" x="710" y="352" width="60" height="18" rx="3"/>
    <text class="s tm elabel" x="740" y="364" text-anchor="middle">GPUNetIO</text>
  </g>

  <!-- Legend -->
  <g class="legend">
    <rect class="k-nvke" x="40" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="70" y="543">GPU CUDA &amp; GPUNetIO Dataplane</text>

    <rect class="k-nvkr" x="320" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="350" y="543">State Machine &amp; Flow Control</text>

    <rect class="k-hw" x="600" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="630" y="543">BlueField DPU &amp; Network Wire</text>

    <rect class="k-tp" x="870" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="900" y="543">Preflight &amp; Configuration</text>

    <text class="s tm" x="40" y="580">Samurai DOCA GPUNetIO &amp; DPU Architecture - Hardware Offload Specification</text>
  </g>
</svg>
