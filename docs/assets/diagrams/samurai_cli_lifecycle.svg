<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="cli-seq-title cli-seq-desc">
  <title id="cli-seq-title">Samurai CLI &amp; Worker Execution Lifecycle</title>
  <desc id="cli-seq-desc">Sequence flow: SecOps Operator, samurai CLI, Args Validation, Native Supervisor Engine, and ZMQ Worker Process with Heartbeats and Metrics.</desc>
  <style>
    text { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; }
    .bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    .t { fill: #1A1A1A; }
    .tm { fill: #4B4B4B; }
    .tw { fill: #FFFFFF; }
    .tk { fill: #000000; }
    .l { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; font-weight: 400; }
    .gl { font-size: 13px; font-weight: 600; }
    .k-nvke { fill: #76B900; }
    .k-nvkr { fill: #952FC6; }
    .k-nv { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    .k-tp { fill: #E0E0E0; }
    .k-hw { fill: #4B4B4B; }
    .k-actor { fill: #FFFFFF; stroke: #757575; stroke-width: 1.5; }
    .k-nvke-o { fill: #FFFFFF; stroke: #3F8500; stroke-width: 1.5; }
    .k-nvkr-o { fill: #FFFFFF; stroke: #952FC6; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .g { fill: none; stroke: #757575; stroke-width: 1.5; }
    .e { fill: none; stroke: #4B4B4B; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: #4B4B4B; }
    .ko { fill: #FFFFFF; }
    .ll { stroke: #A7A7A7; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .band { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .badge { fill: #F9C500; }
    .num { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1A1A; stroke: #313131; }
      .t { fill: #FFFFFF; }
      .tm { fill: #A7A7A7; }
      .k-nv { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-tp { fill: #313131; }
      .k-hw { fill: #757575; }
      .k-actor { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-nvke-o { fill: #1A1A1A; stroke: #76B900; }
      .k-nvkr-o { fill: #1A1A1A; stroke: #C359EF; }
      .g { stroke: #757575; }
      .e { stroke: #A7A7A7; }
      .ah { fill: #A7A7A7; }
      .ko { fill: #1A1A1A; }
      .ll { stroke: #757575; }
      .num { fill: #1A1A1A; stroke: #A7A7A7; }
    }
</style>
  
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M1,1.5 L9,5 L1,8.5 Z"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M9,1.5 L1,5 L9,8.5 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1079" height="579" rx="16"/>

  <!-- Actor Lifelines (Headers) -->
  <g class="node">
    <rect class="k-actor" x="40" y="24" width="160" height="50" rx="25"/>
    <text class="l t" x="120" y="46" text-anchor="middle">Operator</text>
    <text class="s tm" x="120" y="62" text-anchor="middle">CLI Invoker</text>
  </g>
  <g class="node">
    <rect class="k-nv" x="250" y="24" width="160" height="50" rx="8"/>
    <text class="l t" x="330" y="46" text-anchor="middle">samurai CLI</text>
    <text class="s tm" x="330" y="62" text-anchor="middle">main.cpp</text>
  </g>
  <g class="node">
    <rect class="k-nvkr" x="460" y="24" width="160" height="50" rx="8"/>
    <text class="l tw" x="540" y="46" text-anchor="middle">TargetSafety</text>
    <text class="s tw" x="540" y="62" text-anchor="middle">validation.cpp</text>
  </g>
  <g class="node">
    <rect class="k-nvke" x="670" y="24" width="160" height="50" rx="8"/>
    <text class="l tk" x="750" y="46" text-anchor="middle">Supervisor</text>
    <text class="s tk" x="750" y="62" text-anchor="middle">supervisor.cpp</text>
  </g>
  <g class="node">
    <rect class="k-hw" x="880" y="24" width="160" height="50" rx="8"/>
    <text class="l tw" x="960" y="46" text-anchor="middle">Worker Binary</text>
    <text class="s tw" x="960" y="62" text-anchor="middle">samurai_*_worker</text>
  </g>

  <!-- Dashed Vertical Lifelines -->
  <line class="ll" x1="120" y1="74" x2="120" y2="520"/>
  <line class="ll" x1="330" y1="74" x2="330" y2="520"/>
  <line class="ll" x1="540" y1="74" x2="540" y2="520"/>
  <line class="ll" x1="750" y1="74" x2="750" y2="520"/>
  <line class="ll" x1="960" y1="74" x2="960" y2="520"/>

  <!-- Step 1: User runs command -->
  <g class="edge">
    <path class="e" d="M120,115 L330,115" marker-end="url(#ah)"/>
    <rect class="ko" x="145" y="102" width="160" height="20" rx="4"/>
    <text class="s tm elabel" x="225" y="116" text-anchor="middle">1. ./samurai --worker afxdp ...</text>
  </g>

  <!-- Step 2: Validate Target & Security -->
  <g class="edge">
    <path class="e" d="M330,165 L540,165" marker-end="url(#ah)"/>
    <rect class="ko" x="365" y="152" width="140" height="20" rx="4"/>
    <text class="s tm elabel" x="435" y="166" text-anchor="middle">2. ValidateTarget()</text>
  </g>
  <g class="edge">
    <path class="e dash" d="M540,205 L330,205" marker-end="url(#ah)"/>
    <rect class="ko" x="375" y="192" width="120" height="20" rx="4"/>
    <text class="s tm elabel" x="435" y="206" text-anchor="middle">3. Safety Check: Allowed</text>
  </g>

  <!-- Step 3: RunJob via Supervisor -->
  <g class="edge">
    <path class="e" d="M330,250 L750,250" marker-end="url(#ah)"/>
    <rect class="ko" x="460" y="237" width="160" height="20" rx="4"/>
    <text class="s tm elabel" x="540" y="251" text-anchor="middle">4. RunJob(JobOptions)</text>
  </g>

  <!-- Step 4: Fork & Spawn Worker -->
  <g class="edge">
    <path class="e" d="M750,295 L960,295" marker-end="url(#ah)"/>
    <rect class="ko" x="785" y="282" width="140" height="20" rx="4"/>
    <text class="s tm elabel" x="855" y="296" text-anchor="middle">5. fork() + execvp()</text>
  </g>

  <!-- Step 5: Start Job Envelope over ZMQ IPC -->
  <g class="edge">
    <path class="e" d="M750,340 L960,340" marker-end="url(#ah)"/>
    <rect class="ko" x="770" y="327" width="170" height="20" rx="4"/>
    <text class="s tm elabel" x="855" y="341" text-anchor="middle">6. START_JOB (ZMQ IPC)</text>
  </g>

  <!-- Step 6: Telemetry Loop (Bi-directional) -->
  <g class="band">
    <rect class="band" x="710" y="375" width="290" height="60" rx="6"/>
    <text class="s tm" x="720" y="392">Telemetry &amp; Watchdog Loop</text>
  </g>
  <g class="edge">
    <path class="e dash" d="M960,410 L750,410" marker-end="url(#ah)"/>
    <rect class="ko" x="770" y="398" width="170" height="20" rx="4"/>
    <text class="s tm elabel" x="855" y="412" text-anchor="middle">7. HEARTBEAT &amp; SNAPSHOT</text>
  </g>

  <!-- Step 7: Completion & Result Reporting -->
  <g class="edge">
    <path class="e" d="M960,460 L750,460" marker-end="url(#ah)"/>
    <rect class="ko" x="790" y="447" width="130" height="20" rx="4"/>
    <text class="s tm elabel" x="855" y="461" text-anchor="middle">8. JOB_DONE (Summary)</text>
  </g>
  <g class="edge">
    <path class="e" d="M750,490 L330,490" marker-end="url(#ah)"/>
    <rect class="ko" x="480" y="477" width="120" height="20" rx="4"/>
    <text class="s tm elabel" x="540" y="491" text-anchor="middle">9. ExecutionSummary</text>
  </g>
  <g class="edge">
    <path class="e" d="M330,515 L120,515" marker-end="url(#ah)"/>
    <rect class="ko" x="160" y="502" width="130" height="20" rx="4"/>
    <text class="s tm elabel" x="225" y="516" text-anchor="middle">10. Output Console / JSON</text>
  </g>

  <!-- Bottom Legend -->
  <g class="legend">
    <rect class="k-nvke" x="40" y="542" width="20" height="14" rx="3"/>
    <text class="s t" x="68" y="554">Native Supervisor Engine</text>

    <rect class="k-nvkr" x="260" y="542" width="20" height="14" rx="3"/>
    <text class="s t" x="288" y="554">Safety Verification Gate</text>

    <rect class="k-hw" x="480" y="542" width="20" height="14" rx="3"/>
    <text class="s t" x="508" y="554">Isolated Worker Process</text>

    <path class="e" d="M680,549 H710" marker-end="url(#ah)"/>
    <text class="s t" x="718" y="554">Synchronous RPC</text>

    <path class="e dash" d="M840,549 H870" marker-end="url(#ah)"/>
    <text class="s t" x="878" y="554">Asynchronous Heartbeat</text>
  </g>
</svg>
