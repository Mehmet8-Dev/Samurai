<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="numa-arch-title numa-arch-desc">
  <title id="numa-arch-title">Samurai NUMA &amp; Kernel-Bypass Architecture</title>
  <desc id="numa-arch-desc">Architecture showing NUMA local core affinity, Hugepages, AF_XDP Zero-Copy UMEM rings, DPDK PMD bursts, and remote socket cross-UPI penalty avoidance.</desc>
  <style>
    text { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; }
    .bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    .t { fill: #1A1A1A; }
    .tm { fill: #4B4B4B; }
    .tw { fill: #FFFFFF; }
    .tk { fill: #000000; }
    .l { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; font-weight: 400; }
    .gl { font-size: 13px; font-weight: 600; }
    .k-nvke { fill: #76B900; }
    .k-nvkr { fill: #952FC6; }
    .k-nv { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    .k-tp { fill: #E0E0E0; }
    .k-hw { fill: #4B4B4B; }
    .k-actor { fill: #FFFFFF; stroke: #757575; stroke-width: 1.5; }
    .k-nvke-o { fill: #FFFFFF; stroke: #3F8500; stroke-width: 1.5; }
    .k-nvkr-o { fill: #FFFFFF; stroke: #952FC6; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .g { fill: none; stroke: #757575; stroke-width: 1.5; }
    .e { fill: none; stroke: #4B4B4B; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: #4B4B4B; }
    .ko { fill: #FFFFFF; }
    .ll { stroke: #A7A7A7; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .band { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .badge { fill: #F9C500; }
    .num { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1A1A; stroke: #313131; }
      .t { fill: #FFFFFF; }
      .tm { fill: #A7A7A7; }
      .k-nv { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-tp { fill: #313131; }
      .k-hw { fill: #757575; }
      .k-actor { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-nvke-o { fill: #1A1A1A; stroke: #76B900; }
      .k-nvkr-o { fill: #1A1A1A; stroke: #C359EF; }
      .g { stroke: #757575; }
      .e { stroke: #A7A7A7; }
      .ah { fill: #A7A7A7; }
      .ko { fill: #1A1A1A; }
      .ll { stroke: #757575; }
      .num { fill: #1A1A1A; stroke: #A7A7A7; }
    }
</style>
  
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M1,1.5 L9,5 L1,8.5 Z"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M9,1.5 L1,5 L9,8.5 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1119" height="639" rx="16"/>

  <!-- Top Banner -->
  <g class="node">
    <rect class="k-nvke" x="40" y="24" width="1040" height="52" rx="8"/>
    <text class="l tk" x="560" y="46" text-anchor="middle">Samurai NUMA Node Affinity &amp; Kernel-Bypass Memory Architecture</text>
    <text class="s tk" x="560" y="64" text-anchor="middle">Zero-Copy UMEM Ring Buffers, DPDK Hugepages, and Cross-Socket UPI Penalty Avoidance</text>
  </g>

  <!-- Left: NUMA Node 0 (Local Socket) -->
  <g class="group">
    <rect class="g" x="40" y="100" width="510" height="380" rx="12"/>
    <text class="gl tm" x="56" y="124">NUMA Node 0 (Local CPU Socket &amp; Low Latency)</text>

    <g class="node">
      <rect class="k-nvke" x="60" y="144" width="225" height="64" rx="8"/>
      <text class="l tk" x="172" y="170" text-anchor="middle">Pinned CPU Worker Cores</text>
      <text class="s tk" x="172" y="188" text-anchor="middle">--pin-cpu 2,3,4,5 (Isolated)</text>
      <text class="s tk" x="172" y="202" text-anchor="middle">Zero Context-Switch Overhead</text>
    </g>

    <g class="node">
      <rect class="k-nvkr" x="305" y="144" width="225" height="64" rx="8"/>
      <text class="l tw" x="417" y="170" text-anchor="middle">Pre-Allocated Hugepages</text>
      <text class="s tw" x="417" y="188" text-anchor="middle">2MB / 1GB Hugepage TLB</text>
      <text class="s tw" x="417" y="202" text-anchor="middle">TLB Misses Eliminated</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="60" y="224" width="225" height="64" rx="8"/>
      <text class="l t" x="172" y="250" text-anchor="middle">AF_XDP Zero-Copy UMEM</text>
      <text class="s tm" x="172" y="268" text-anchor="middle">Fill, Rx, Tx, Completion Rings</text>
      <text class="s tm" x="172" y="282" text-anchor="middle">XSK / libbpf Direct Memory</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="305" y="224" width="225" height="64" rx="8"/>
      <text class="l t" x="417" y="250" text-anchor="middle">DPDK PMD Ring Buffers</text>
      <text class="s tm" x="417" y="268" text-anchor="middle">rte_eth_tx_burst() Direct</text>
      <text class="s tm" x="417" y="282" text-anchor="middle">Lock-Free mbuf Allocation</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="60" y="304" width="470" height="58" rx="8"/>
      <text class="l tw" x="295" y="328" text-anchor="middle">Local PCIe Gen4 / Gen5 Root Port (Bus 00:01.0)</text>
      <text class="s tw" x="295" y="346" text-anchor="middle">Direct Peer Link to NIC: Latency ~150-180 ns (Zero Hop)</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="60" y="378" width="470" height="86" rx="8"/>
      <text class="s t" x="295" y="400" text-anchor="middle">Strict NUMA Affinity Policy</text>
      <text class="s tm" x="295" y="418" text-anchor="middle">Target Rule: Same Worker Core -&gt; Same NIC Queue -&gt; Same NUMA Node</text>
      <text class="s tm" x="295" y="434" text-anchor="middle">Guaranteed 148.8 Mpps Line-Rate Egress @ 64-byte Packets</text>
      <text class="s tm" x="295" y="450" text-anchor="middle">Memory Access Bandwidth: &gt; 120 GB/s Local DDR4/5</text>
    </g>
  </g>

  <!-- Right: NUMA Node 1 (Remote Socket - Avoided) -->
  <g class="group">
    <rect class="g" x="580" y="100" width="500" height="380" rx="12"/>
    <text class="gl tm" x="596" y="124">NUMA Node 1 (Remote Socket — Avoided via Policy)</text>

    <g class="node">
      <rect class="k-tp" x="600" y="144" width="460" height="64" rx="8"/>
      <text class="l t" x="830" y="170" text-anchor="middle">Remote CPU Cores &amp; Memory</text>
      <text class="s tm" x="830" y="188" text-anchor="middle">Cores 8,9,10,11 (Non-Local NUMA Socket)</text>
      <text class="s tm" x="830" y="202" text-anchor="middle">Unpinned or Non-Affinitized Allocation</text>
    </g>

    <g class="node">
      <rect class="k-nvkr-o dash" x="600" y="224" width="460" height="64" rx="8"/>
      <text class="l t" x="830" y="250" text-anchor="middle">Cross-Socket UPI / QPI Interconnect Link</text>
      <text class="s tm" x="830" y="268" text-anchor="middle">+35% to +50% Latency &amp; Jitter Penalty</text>
      <text class="s tm" x="830" y="282" text-anchor="middle">Interconnect Bus Contention Bottleneck</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="600" y="304" width="460" height="58" rx="8"/>
      <text class="l tw" x="830" y="328" text-anchor="middle">Remote NIC Access Penalty</text>
      <text class="s tw" x="830" y="346" text-anchor="middle">Multi-Hop Traversal: ~380-450 ns Latency (+120% Penalty)</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="600" y="378" width="460" height="86" rx="8"/>
      <text class="s t" x="830" y="400" text-anchor="middle">Detection &amp; Validation Gate</text>
      <text class="s tm" x="830" y="418" text-anchor="middle">numactl --cpunodebind=0 --membind=0 Preflight Enforcement</text>
      <text class="s tm" x="830" y="434" text-anchor="middle">Automatic Warning on Cross-NUMA Socket Mapping</text>
      <text class="s tm" x="830" y="450" text-anchor="middle">Deterministic Telemetry Verification</text>
    </g>
  </g>

  <!-- Bottom: Hardware NIC & Multi-Queue DMA -->
  <g class="group">
    <rect class="g" x="40" y="500" width="1040" height="85" rx="12"/>
    <text class="gl tm" x="56" y="522">High-Speed Hardware NIC &amp; Multi-Queue RSS Engine</text>

    <g class="node">
      <rect class="k-hw" x="60" y="534" width="310" height="42" rx="6"/>
      <text class="s tw" x="215" y="560" text-anchor="middle">Hardware Queue 0..N (1:1 Core Mapping)</text>
    </g>
    <g class="node">
      <rect class="k-hw" x="390" y="534" width="320" height="42" rx="6"/>
      <text class="s tw" x="550" y="560" text-anchor="middle">Zero-Copy DMA Controller (PCIe Direct)</text>
    </g>
    <g class="node">
      <rect class="k-hw" x="730" y="534" width="330" height="42" rx="6"/>
      <text class="s tw" x="895" y="560" text-anchor="middle">100GbE / 200GbE Line-Rate Wire Egress</text>
    </g>
  </g>

  <!-- Legend -->
  <g class="legend">
    <rect class="k-nvke" x="40" y="605" width="20" height="14" rx="3"/>
    <text class="s t" x="68" y="617">Optimal Local NUMA Path</text>

    <rect class="k-nvkr" x="250" y="605" width="20" height="14" rx="3"/>
    <text class="s t" x="278" y="617">Hugepages / Allocation</text>

    <rect class="k-tp" x="460" y="605" width="20" height="14" rx="3"/>
    <text class="s t" x="488" y="617">Remote / Cross-Socket Penalty</text>

    <rect class="k-hw" x="720" y="605" width="20" height="14" rx="3"/>
    <text class="s t" x="748" y="617">Hardware PCIe &amp; NIC Fabric</text>
  </g>
</svg>
