<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="telco-arch-title telco-arch-desc">
  <title id="telco-arch-title">Samurai Telecom &amp; Carrier 4G/5G Resiliency Engine</title>
  <desc id="telco-arch-desc">Telco and carrier-grade testing architecture: GTP-U (UDP/2152), SCTP (Proto 132), SIP/RTP VoIP, and Diameter (3868) using hybrid CPU and CUDA GPU parallel engines.</desc>
  <style>
    text { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; }
    .bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    .t { fill: #1A1A1A; }
    .tm { fill: #4B4B4B; }
    .tw { fill: #FFFFFF; }
    .tk { fill: #000000; }
    .l { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; font-weight: 400; }
    .gl { font-size: 13px; font-weight: 600; }
    .k-nvke { fill: #76B900; }
    .k-nvkr { fill: #952FC6; }
    .k-nv { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    .k-tp { fill: #E0E0E0; }
    .k-hw { fill: #4B4B4B; }
    .k-actor { fill: #FFFFFF; stroke: #757575; stroke-width: 1.5; }
    .k-nvke-o { fill: #FFFFFF; stroke: #3F8500; stroke-width: 1.5; }
    .k-nvkr-o { fill: #FFFFFF; stroke: #952FC6; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .g { fill: none; stroke: #757575; stroke-width: 1.5; }
    .e { fill: none; stroke: #4B4B4B; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: #4B4B4B; }
    .ko { fill: #FFFFFF; }
    .ll { stroke: #A7A7A7; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .band { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .badge { fill: #F9C500; }
    .num { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1A1A; stroke: #313131; }
      .t { fill: #FFFFFF; }
      .tm { fill: #A7A7A7; }
      .k-nv { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-tp { fill: #313131; }
      .k-hw { fill: #757575; }
      .k-actor { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-nvke-o { fill: #1A1A1A; stroke: #76B900; }
      .k-nvkr-o { fill: #1A1A1A; stroke: #C359EF; }
      .g { stroke: #757575; }
      .e { stroke: #A7A7A7; }
      .ah { fill: #A7A7A7; }
      .ko { fill: #1A1A1A; }
      .ll { stroke: #757575; }
      .num { fill: #1A1A1A; stroke: #A7A7A7; }
    }
</style>
  
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M1,1.5 L9,5 L1,8.5 Z"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M9,1.5 L1,5 L9,8.5 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1119" height="619" rx="16"/>

  <!-- Top Banner -->
  <g class="node">
    <rect class="k-nvke" x="40" y="24" width="1040" height="52" rx="8"/>
    <text class="l tk" x="560" y="46" text-anchor="middle">Samurai Carrier &amp; 5G Core Network Resiliency Platform</text>
    <text class="s tk" x="560" y="64" text-anchor="middle">Line-Rate Telecommunication Protocol Stress &amp; SLA Compliance Engine</text>
  </g>

  <!-- Protocol 1: GTP-U (4G EPC / 5G UPF) -->
  <g class="group">
    <rect class="g" x="40" y="104" width="245" height="390" rx="12"/>
    <text class="gl tm" x="56" y="128">1. GTP-U (UDP / 2152)</text>

    <g class="node">
      <rect class="k-nvke" x="55" y="146" width="215" height="60" rx="8"/>
      <text class="l tk" x="162" y="170" text-anchor="middle">5G UPF / 4G EPC Tunnel</text>
      <text class="s tk" x="162" y="188" text-anchor="middle">Mobile User-Plane Data</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="55" y="218" width="215" height="64" rx="8"/>
      <text class="l t" x="162" y="242" text-anchor="middle">TEID Randomization</text>
      <text class="s tm" x="162" y="260" text-anchor="middle">CUDA Warp Dynamic Pool</text>
      <text class="s tm" x="162" y="274" text-anchor="middle">Inner IP Spoofing Engine</text>
    </g>

    <g class="node">
      <rect class="k-nvke-o" x="55" y="294" width="215" height="60" rx="8"/>
      <text class="l t" x="162" y="318" text-anchor="middle">Zero-Copy Senders</text>
      <text class="s tm" x="162" y="336" text-anchor="middle">AF_XDP UMEM + GPU P2P</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="55" y="366" width="215" height="54" rx="6"/>
      <text class="s t" x="162" y="388" text-anchor="middle">Target 5G Core Nodes</text>
      <text class="s tm" x="162" y="404" text-anchor="middle">UPF / SGW-U / PGW-U</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="55" y="430" width="215" height="50" rx="6"/>
      <text class="l tw" x="162" y="452" text-anchor="middle">Throughput Target</text>
      <text class="s tw" x="162" y="468" text-anchor="middle">100 Gbps / 60+ Mpps</text>
    </g>
  </g>

  <!-- Protocol 2: SCTP (4G S1-AP / 5G NG-AP / F1-C) -->
  <g class="group">
    <rect class="g" x="305" y="104" width="245" height="390" rx="12"/>
    <text class="gl tm" x="321" y="128">2. SCTP (IP Proto 132)</text>

    <g class="node">
      <rect class="k-nvkr" x="320" y="146" width="215" height="60" rx="8"/>
      <text class="l tw" x="427" y="170" text-anchor="middle">5G NG-AP / F1-C Signaling</text>
      <text class="s tw" x="427" y="188" text-anchor="middle">4G S1-MME Control-Plane</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="320" y="218" width="215" height="64" rx="8"/>
      <text class="l t" x="427" y="242" text-anchor="middle">CRC32c Checksum</text>
      <text class="s tm" x="427" y="260" text-anchor="middle">SSE4.2 &amp; CUDA Warp Par.</text>
      <text class="s tm" x="427" y="274" text-anchor="middle">Stream ID / VTag Shuffle</text>
    </g>

    <g class="node">
      <rect class="k-nvkr-o" x="320" y="294" width="215" height="60" rx="8"/>
      <text class="l t" x="427" y="318" text-anchor="middle">State Machine Engine</text>
      <text class="s tm" x="427" y="336" text-anchor="middle">INIT / INIT-ACK / COOKIE</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="320" y="366" width="215" height="54" rx="6"/>
      <text class="s t" x="427" y="388" text-anchor="middle">Target 5G Core Nodes</text>
      <text class="s tm" x="427" y="404" text-anchor="middle">AMF / SMF / MME Signaling</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="320" y="430" width="215" height="50" rx="6"/>
      <text class="l tw" x="427" y="452" text-anchor="middle">Connection Scaling</text>
      <text class="s tw" x="427" y="468" text-anchor="middle">10 Million Sessions</text>
    </g>
  </g>

  <!-- Protocol 3: SIP / RTP (Carrier VoIP / IMS) -->
  <g class="group">
    <rect class="g" x="570" y="104" width="245" height="390" rx="12"/>
    <text class="gl tm" x="586" y="128">3. SIP / RTP (VoLTE / IMS)</text>

    <g class="node">
      <rect class="k-nvke" x="585" y="146" width="215" height="60" rx="8"/>
      <text class="l tk" x="692" y="170" text-anchor="middle">Carrier IMS / VoNR Engine</text>
      <text class="s tk" x="692" y="188" text-anchor="middle">SIP Session + RTP Voice</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="585" y="218" width="215" height="64" rx="8"/>
      <text class="l t" x="692" y="242" text-anchor="middle">SIP Dialog Management</text>
      <text class="s tm" x="692" y="260" text-anchor="middle">INVITE, 200 OK, ACK Flood</text>
      <text class="s tm" x="692" y="274" text-anchor="middle">Digest Auth Negotiation</text>
    </g>

    <g class="node">
      <rect class="k-nvke-o" x="585" y="294" width="215" height="60" rx="8"/>
      <text class="l t" x="692" y="318" text-anchor="middle">RTP Media Synthesis</text>
      <text class="s tm" x="692" y="336" text-anchor="middle">G.711 / AMR-WB Codec Packets</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="585" y="366" width="215" height="54" rx="6"/>
      <text class="s t" x="692" y="388" text-anchor="middle">Target IMS Infrastructure</text>
      <text class="s tm" x="692" y="404" text-anchor="middle">P-CSCF / S-CSCF / SBC</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="585" y="430" width="215" height="50" rx="6"/>
      <text class="l tw" x="692" y="452" text-anchor="middle">Concurrent Calls</text>
      <text class="s tw" x="692" y="468" text-anchor="middle">500,000 Active Audio Legs</text>
    </g>
  </g>

  <!-- Protocol 4: Diameter (HSS / PCRF / Billing) -->
  <g class="group">
    <rect class="g" x="835" y="104" width="245" height="390" rx="12"/>
    <text class="gl tm" x="851" y="128">4. Diameter (TCP/SCTP 3868)</text>

    <g class="node">
      <rect class="k-nvkr" x="850" y="146" width="215" height="60" rx="8"/>
      <text class="l tw" x="957" y="170" text-anchor="middle">HSS / PCRF / Billing Core</text>
      <text class="s tw" x="957" y="188" text-anchor="middle">Subscriber Auth &amp; Policy</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="850" y="218" width="215" height="64" rx="8"/>
      <text class="l t" x="957" y="242" text-anchor="middle">AVP Dynamic Encoding</text>
      <text class="s tm" x="957" y="260" text-anchor="middle">Gx / Gy / Cx / Sh / Ro / Rf</text>
      <text class="s tm" x="957" y="274" text-anchor="middle">Hop-by-Hop &amp; End-to-End IDs</text>
    </g>

    <g class="node">
      <rect class="k-nvkr-o" x="850" y="294" width="215" height="60" rx="8"/>
      <text class="l t" x="957" y="318" text-anchor="middle">Multi-Session Concurrency</text>
      <text class="s tm" x="957" y="336" text-anchor="middle">Stateful Credit-Control (CCR)</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="850" y="366" width="215" height="54" rx="6"/>
      <text class="s t" x="957" y="388" text-anchor="middle">Target Subscriber DB</text>
      <text class="s tm" x="957" y="404" text-anchor="middle">HSS / PCRF / OCS / DRA</text>
    </g>

    <g class="node">
      <rect class="k-hw" x="850" y="430" width="215" height="50" rx="6"/>
      <text class="l tw" x="957" y="452" text-anchor="middle">Transactions Rate</text>
      <text class="s tw" x="957" y="468" text-anchor="middle">2,500,000 Trans / Sec</text>
    </g>
  </g>

  <!-- Legend at the bottom -->
  <g class="legend">
    <rect class="k-nvke" x="40" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="70" y="543">High-Rate Mobile Data (GPU/P2P)</text>

    <rect class="k-nvkr" x="320" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="350" y="543">Core Signaling &amp; Billing (SCTP/Diameter)</text>

    <rect class="k-nv" x="620" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="650" y="543">Native Protocol Generator</text>

    <rect class="k-hw" x="850" y="530" width="22" height="16" rx="4"/>
    <text class="s t" x="880" y="543">Hardware Capacity Target</text>

    <text class="s tm" x="40" y="580">Samurai Next-Gen Carrier &amp; Telco Resilience Architecture</text>
  </g>
</svg>
