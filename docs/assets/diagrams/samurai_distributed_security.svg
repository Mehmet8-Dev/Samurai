<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="dist-sec-title dist-sec-desc">
  <title id="dist-sec-title">Samurai Distributed Security &amp; Control Plane</title>
  <desc id="dist-sec-desc">Security and encryption boundaries: CurveZMQ 25519 transport encryption, TLS 1.3 Management REST, JWT RBAC authorization, and Tamper-Evident SHA-256 Audit Logger.</desc>
  <style>
    text { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; }
    .bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    .t { fill: #1A1A1A; }
    .tm { fill: #4B4B4B; }
    .tw { fill: #FFFFFF; }
    .tk { fill: #000000; }
    .l { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; font-weight: 400; }
    .gl { font-size: 13px; font-weight: 600; }
    .k-nvke { fill: #76B900; }
    .k-nvkr { fill: #952FC6; }
    .k-nv { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    .k-tp { fill: #E0E0E0; }
    .k-hw { fill: #4B4B4B; }
    .k-actor { fill: #FFFFFF; stroke: #757575; stroke-width: 1.5; }
    .k-nvke-o { fill: #FFFFFF; stroke: #3F8500; stroke-width: 1.5; }
    .k-nvkr-o { fill: #FFFFFF; stroke: #952FC6; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .g { fill: none; stroke: #757575; stroke-width: 1.5; }
    .e { fill: none; stroke: #4B4B4B; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: #4B4B4B; }
    .ko { fill: #FFFFFF; }
    .ll { stroke: #A7A7A7; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .band { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .badge { fill: #F9C500; }
    .num { fill: #FFFFFF; stroke: #4B4B4B; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1A1A; stroke: #313131; }
      .t { fill: #FFFFFF; }
      .tm { fill: #A7A7A7; }
      .k-nv { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-tp { fill: #313131; }
      .k-hw { fill: #757575; }
      .k-actor { fill: #1A1A1A; stroke: #A7A7A7; }
      .k-nvke-o { fill: #1A1A1A; stroke: #76B900; }
      .k-nvkr-o { fill: #1A1A1A; stroke: #C359EF; }
      .g { stroke: #757575; }
      .e { stroke: #A7A7A7; }
      .ah { fill: #A7A7A7; }
      .ko { fill: #1A1A1A; }
      .ll { stroke: #757575; }
      .num { fill: #1A1A1A; stroke: #A7A7A7; }
    }
</style>
  
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M1,1.5 L9,5 L1,8.5 Z"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M9,1.5 L1,5 L9,8.5 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1119" height="599" rx="16"/>

  <!-- Top Title / Pillar -->
  <g class="node">
    <rect class="k-nvke" x="40" y="24" width="1040" height="52" rx="8"/>
    <text class="l tk" x="560" y="46" text-anchor="middle">Samurai Distributed Control Plane Security Architecture</text>
    <text class="s tk" x="560" y="64" text-anchor="middle">End-to-End Cryptography, Zero-Trust Interconnect, and Tamper-Evident Ledger</text>
  </g>

  <!-- Box 1: Network Transport Layer (Left) -->
  <g class="group">
    <rect class="g" x="40" y="104" width="330" height="380" rx="12"/>
    <text class="gl tm" x="56" y="128">1. Network Transport Security</text>

    <g class="node">
      <rect class="k-nvkr" x="60" y="148" width="290" height="64" rx="8"/>
      <text class="l tw" x="205" y="174" text-anchor="middle">CurveZMQ (Libsodium 25519)</text>
      <text class="s tw" x="205" y="192" text-anchor="middle">Z85 Encrypted RPC Channels</text>
      <text class="s tw" x="205" y="206" text-anchor="middle">Master-Slave Wire Protection</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="60" y="228" width="290" height="64" rx="8"/>
      <text class="l t" x="205" y="254" text-anchor="middle">OpenSSL TLS 1.2 / 1.3</text>
      <text class="s tm" x="205" y="272" text-anchor="middle">Management API HTTPS (:8443)</text>
      <text class="s tm" x="205" y="286" text-anchor="middle">Self-Signed or Enterprise PKI</text>
    </g>

    <g class="node">
      <rect class="k-nvke-o" x="60" y="308" width="290" height="64" rx="8"/>
      <text class="l t" x="205" y="334" text-anchor="middle">Non-Loopback Hard Gate</text>
      <text class="s tm" x="205" y="352" text-anchor="middle">Fails-Safe on Plaintext 0.0.0.0</text>
      <text class="s tm" x="205" y="366" text-anchor="middle">Forced Encryption in Production</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="60" y="388" width="290" height="74" rx="8"/>
      <text class="s t" x="205" y="412" text-anchor="middle">Zero Overhead ZMQ Serialization</text>
      <text class="s tm" x="205" y="430" text-anchor="middle">Binary Control Protocol V1</text>
      <text class="s tm" x="205" y="446" text-anchor="middle">High-Throughput Heartbeat Streams</text>
    </g>
  </g>

  <!-- Box 2: Identity & Access Control (Center) -->
  <g class="group">
    <rect class="g" x="395" y="104" width="330" height="380" rx="12"/>
    <text class="gl tm" x="411" y="128">2. Identity &amp; Access Layer</text>

    <g class="node">
      <rect class="k-nvkr" x="415" y="148" width="290" height="64" rx="8"/>
      <text class="l tw" x="560" y="174" text-anchor="middle">HMAC-SHA256 JWT Tokens</text>
      <text class="s tw" x="560" y="192" text-anchor="middle">Time-Bound Operator Auth</text>
      <text class="s tw" x="560" y="206" text-anchor="middle">Secure Bearer Verification</text>
    </g>

    <g class="node">
      <rect class="k-nvke" x="415" y="228" width="290" height="64" rx="8"/>
      <text class="l tk" x="560" y="254" text-anchor="middle">Role-Based Access (RBAC)</text>
      <text class="s tk" x="560" y="272" text-anchor="middle">Admin, Operator, Read-Only</text>
      <text class="s tk" x="560" y="286" text-anchor="middle">Restricted Test Execution Rights</text>
    </g>

    <g class="node">
      <rect class="k-nv" x="415" y="308" width="290" height="64" rx="8"/>
      <text class="l t" x="560" y="334" text-anchor="middle">x-cluster-secret Token</text>
      <text class="s tm" x="560" y="352" text-anchor="middle">Internal Node Authentication</text>
      <text class="s tm" x="560" y="366" text-anchor="middle">Slave Joining Authorization</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="415" y="388" width="290" height="74" rx="8"/>
      <text class="s t" x="560" y="412" text-anchor="middle">Multi-Tenant Tenant Isolation</text>
      <text class="s tm" x="560" y="430" text-anchor="middle">Namespace Separation</text>
      <text class="s tm" x="560" y="446" text-anchor="middle">Resource Quotas per Organization</text>
    </g>
  </g>

  <!-- Box 3: Audit, Ledger & Integrity (Right) -->
  <g class="group">
    <rect class="g" x="750" y="104" width="330" height="380" rx="12"/>
    <text class="gl tm" x="766" y="128">3. Tamper-Evident Ledger &amp; HA</text>

    <g class="node">
      <rect class="k-hw" x="770" y="148" width="290" height="64" rx="8"/>
      <text class="l tw" x="915" y="174" text-anchor="middle">SHA-256 Hash Chain Audit</text>
      <text class="s tw" x="915" y="192" text-anchor="middle">Immutable Event Ledger</text>
      <text class="s tw" x="915" y="206" text-anchor="middle">Forensic Non-Repudiation</text>
    </g>

    <g class="node">
      <rect class="k-nvke" x="770" y="228" width="290" height="64" rx="8"/>
      <text class="l tk" x="915" y="254" text-anchor="middle">High Availability (HA)</text>
      <text class="s tk" x="915" y="272" text-anchor="middle">FileLease / Static Leader Election</text>
      <text class="s tk" x="915" y="286" text-anchor="middle">Zero Downtime Master Failover</text>
    </g>

    <g class="node">
      <rect class="k-nvke-o" x="770" y="308" width="290" height="64" rx="8"/>
      <text class="l t" x="915" y="334" text-anchor="middle">TargetSafety Engine</text>
      <text class="s tm" x="915" y="352" text-anchor="middle">Deny-List &amp; Scope Boundary</text>
      <text class="s tm" x="915" y="366" text-anchor="middle">Hard Stop on Unapproved Subnets</text>
    </g>

    <g class="node">
      <rect class="k-tp" x="770" y="388" width="290" height="74" rx="8"/>
      <text class="s t" x="915" y="412" text-anchor="middle">Prometheus &amp; SIEM Forwarding</text>
      <text class="s tm" x="915" y="430" text-anchor="middle">OpenTelemetry Export</text>
      <text class="s tm" x="915" y="446" text-anchor="middle">Real-Time Security Event Feeds</text>
    </g>
  </g>

  <!-- Legend at the bottom -->
  <g class="legend">
    <rect class="k-nvke" x="40" y="520" width="22" height="16" rx="4"/>
    <text class="s t" x="70" y="533">Core Samurai Security Module</text>

    <rect class="k-nvkr" x="320" y="520" width="22" height="16" rx="4"/>
    <text class="s t" x="350" y="533">Cryptography &amp; Identity Engine</text>

    <rect class="k-hw" x="600" y="520" width="22" height="16" rx="4"/>
    <text class="s t" x="630" y="533">Tamper-Proof Audit &amp; Hardware Gate</text>

    <rect class="k-tp" x="870" y="520" width="22" height="16" rx="4"/>
    <text class="s t" x="900" y="533">SIEM &amp; Integration</text>

    <path class="e" d="M40,560 H70" marker-end="url(#ah)"/>
    <text class="s t" x="78" y="564">Encrypted Communication Bus</text>
  </g>
</svg>
