[pytest]
testpaths = tests
addopts = -q -rs
markers =
    ci_safe: Test is safe for CI default profile.
    privileged: Requires privileged/root-capable environment or extended system capabilities.
    gpu: Requires CUDA/GPU-capable environment.
    benchmark: Performance/benchmark test.
    rfc_positive: RFC positive/compliance suite.
    rfc_negative: RFC negative/expected-violation suite.
