# Note: Samurai's production runtime, CLI, MCP server, and dataplane workers are
# 100% native C++17 built via CMake (`cmake -B build -S samurai`).
# This pyproject.toml is retained strictly for the Python test harness (`tests/`)
# and offline Mahoraga RL training utilities (`samurai/models/`).
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samurai"
version = "3.5.0"
description = "Samurai - Offline Python test & Mahoraga RL training harness for the native C++17 network resilience platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyzmq",
  "requests",
  "pytest",
  "PyYAML",
  "httpx[http2]",
  "psutil",
  "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["samurai", "samurai.*"]


[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
  "third_party",
  "samurai/venv",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # line length handled pragmatically in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
