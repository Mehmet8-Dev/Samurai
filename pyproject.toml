[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddos-samurai"
version = "3.0.0"
description = "Samurai - High Performance Layer 4-7 Traffic Generation and Admission Control Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyzmq",
  "requests",
  "pytest",
  "PyYAML",
  "httpx[http2]",
  "psutil",
  "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ddos_samurai*"]


[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
  "third_party",
  "ddos_samurai/venv",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # line length handled pragmatically in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
