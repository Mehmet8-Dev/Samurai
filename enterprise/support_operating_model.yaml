schema: samurai.enterprise.support_model.v1
levels:
  L1:
    scope: runbook-based issue triage
    escalation_to: L2
  L2:
    scope: platform operations and reproducible defects
    escalation_to: L3
  L3:
    scope: engineering and architecture-level incidents
    escalation_to: on_call_architect
escalation_matrix:
  critical:
    target_ack_minutes: 15
    target_bridge_minutes: 30
  high:
    target_ack_minutes: 60
    target_bridge_minutes: 180
maintenance_windows:
  default_utc: "Saturdays 02:00-04:00"
