schema: samurai.enterprise.security_questionnaire.v1
sections:
  - id: identity_access
    controls:
      - RBAC with role scoping
      - JWT and trusted identity header support
      - tenant claim enforcement
  - id: auditability
    controls:
      - immutable append-only RBAC audit chain
      - audit chain verification utility
  - id: secure_release
    controls:
      - SBOM generation
      - dependency vulnerability gate
      - release acceptance test gate
  - id: resiliency
    controls:
      - backup and restore scripts
      - SLO policy checks
      - auto-abort safety thresholds
