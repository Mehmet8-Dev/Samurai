model:
  name: mamba2-small
  max_sequence_length: 128
  hidden_size: 512
  num_layers: 12
  d_state: 16
  d_conv: 4
  expand: 2

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  seed: 1337

objective:
  type: autoregressive_multi_field_sequence
  fields:
    - event_type
    - delay_bucket
    - method
    - path_bucket
    - header_profile
    - payload_class
    - mutation_signature
