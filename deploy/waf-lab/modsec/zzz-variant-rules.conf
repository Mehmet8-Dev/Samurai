# DDoSamurai zoo — custom ModSecurity rules giving this engine a DISTINCT blocked-
# variant personality from the Coraza profiles. request_mix variant -> path map:
#   0 GET /            (allowed)      1 GET /search?q=...   2 GET /api/v1/status
#   3 POST /login      4 GET /static/app.js
# Coraza waf-heavy blocks {1,3}; this modsec target blocks {2,4} instead, so the
# union corpus teaches the policy that WHICH lever setting is walled depends on the
# target (reaction-conditioning), not a single fixed marginal.
SecRule REQUEST_URI "@beginsWith /api/v1/status" \
    "id:1000021,phase:1,deny,status:403,log,msg:'zoo-modsec block variant2 api'"
SecRule REQUEST_URI "@beginsWith /static/" \
    "id:1000041,phase:1,deny,status:403,log,msg:'zoo-modsec block variant4 static'"
