# Profile: waf-heavy — aggressive WAF + a strict, low rate cap.
#
# The tightest tier: a low sustained rate with a small, DELAYED burst (requests
# queue then 429 rather than being served immediately), plus WAF blocks on
# different variants than strict-waf (see waf-rules.conf). Forces the policy to
# actually read the reaction instead of memorizing "avoid variant 2".
#   - limit_req exceeded -> 429 -> status_4xx (low ceiling, ~70 r/s honored)

worker_processes auto;
events { worker_connections 4096; }

http {
    log_format ratelimit '$remote_addr - [$time_local] "$request" '
                         '$status limit_req=$limit_req_status';
    access_log /var/log/nginx/access.log ratelimit;
    error_log  /var/log/nginx/error.log warn;

    # Low cap so the wall is hit early. nodelay: excess over the burst is REJECTED
    # (429) immediately rather than queued/delayed — a paced closed-loop client that
    # waits on responses never overflows a delayed queue, so a delay-only limiter is
    # invisible to an error-based SLO (it only raises latency). nodelay turns the
    # ceiling into a real error wall that punishes overshoot.
    limit_req_zone  $binary_remote_addr zone=perip:16m   rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:16m;
    limit_req_status  429;
    limit_conn_status 503;

    upstream origin { server whoami:80; keepalive 64; }

    server {
        listen 80 default_server;
        server_name _;

        location = /healthz { return 200 "ok\n"; }

        location / {
            limit_req  zone=perip burst=20 nodelay;   # reject excess as 429 (real wall)
            limit_conn connperip 200;
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
