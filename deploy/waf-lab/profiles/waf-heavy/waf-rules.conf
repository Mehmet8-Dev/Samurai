# Profile: waf-heavy — blocks DIFFERENT variants than strict-waf.
#
# strict-waf blocks variant 2 (/api/v1/status). This profile instead 403s
# variant 1 (/search?...) and variant 3 (POST /login) and leaves variant 2 open.
# The blocked set differs on purpose: a policy that merely memorized "avoid 2"
# from strict-waf must fail here, so training on the union forces it to read the
# per-variant 4xx reaction rather than hard-coding a variant index.

# --- Path traversal -------------------------------------------------------------
SecRule REQUEST_URI "@rx (?i)(?:\.\./|\.\.\\|%2e%2e%2f|%2e%2e/)" \
    "id:100001,phase:1,t:none,t:urlDecodeUni,msg:'Path traversal',tag:'attack-lfi'"

# --- SQL injection --------------------------------------------------------------
SecRule ARGS "@rx (?i)(?:union\s+select|or\s+1\s*=\s*1|;\s*drop\s+table|sleep\s*\()" \
    "id:100002,phase:2,t:none,t:urlDecodeUni,t:lowercase,msg:'SQL injection',tag:'attack-sqli'"

# --- Cross-site scripting -------------------------------------------------------
SecRule ARGS "@rx (?i)(?:<script|javascript:|onerror\s*=|onload\s*=)" \
    "id:100003,phase:2,t:none,t:urlDecodeUni,t:htmlEntityDecode,msg:'XSS',tag:'attack-xss'"

# --- OS command injection -------------------------------------------------------
SecRule ARGS "@rx (?i)(?:;\s*(?:cat|ls|id|wget|curl|nc)\b|\|\s*(?:sh|bash)\b|`[^`]+`)" \
    "id:100004,phase:2,t:none,t:urlDecodeUni,msg:'Command injection',tag:'attack-rce'"

# --- Known scanner / bad-bot user agents ---------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:sqlmap|nikto|nmap|masscan|dirbuster|nuclei|acunetix)" \
    "id:100005,phase:1,t:none,msg:'Scanner user-agent',tag:'attack-scanner'"

# --- Policy: protected paths (DIFFERENT from strict-waf) ------------------------
# Variant 1: /search — pretend query inspection deems it off-limits under load.
SecRule REQUEST_URI "@rx (?i)^/search\b" \
    "id:100011,phase:1,t:none,msg:'Blocked protected path (search)',tag:'policy-block'"
# Variant 3: POST /login — state-changing auth endpoint locked down.
SecRule REQUEST_URI "@rx (?i)^/login\b" \
    "id:100012,phase:1,t:none,msg:'Blocked protected path (login)',tag:'policy-block'"
