# Rate-limit / overload tier for the WAF lab. Turns sustained load into the exact
# defense-reaction signals the RL corpus captures:
#   - limit_req  exceeded  -> 429  (rate limited)          -> status_4xx
#   - limit_conn exceeded  -> 503  (overloaded / shedding) -> status_5xx
# The 429 access lines feed fail2ban (see fail2ban/filter.d), whose bans then show
# up as connection refusals (conn_attempted vs conn_established gap).

worker_processes auto;
events { worker_connections 4096; }

http {
    log_format ratelimit '$remote_addr - [$time_local] "$request" '
                         '$status limit_req=$limit_req_status';
    access_log /var/log/nginx/access.log ratelimit;
    error_log  /var/log/nginx/error.log warn;

    # Per-source request-rate and concurrent-connection ceilings. Tune these to sit
    # *below* the load you drive so the closed-loop search actually hits the wall.
    # (Edit here directly — this file is bind-mounted verbatim, no env templating.)
    limit_req_zone  $binary_remote_addr zone=perip:16m   rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:16m;
    limit_req_status  429;
    limit_conn_status 503;

    upstream origin { server whoami:80; keepalive 64; }

    server {
        listen 80 default_server;
        server_name _;

        # Liveness probe that bypasses the limiters.
        location = /healthz { return 200 "ok\n"; }

        location / {
            limit_req  zone=perip burst=50 nodelay;
            # NB: this keys on $binary_remote_addr, which upstream of caddy is
            # *caddy's* pooled connection (<=64), not the client's — so client
            # concurrency does not reach this counter in the caddy->nginx topology.
            # Kept as a coarse backstop; the concurrency lever is honored at the
            # generator (real parallel connections) but this defended stack has no
            # per-client connection limit that reacts to it.
            limit_conn connperip 200;
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
