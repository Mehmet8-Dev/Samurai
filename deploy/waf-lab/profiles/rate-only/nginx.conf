# Profile: rate-only — a PURE uniform rate-limiter, no path policy.
#
# Higher ceiling than strict-waf and no WAF block on any benign variant, so the
# only defense the generator meets is a per-source request-rate cap that treats
# every request_mix the same. The corpus this yields teaches the policy (and tests
# the fingerprint) the "uniform limiter, path-insensitive" regime: request_mix
# does NOT change the honored rate — only rps does. Contrast with strict-waf /
# waf-heavy, where specific variants are 403'd.
#   - limit_req exceeded -> 429 -> status_4xx (rate limited; no 403s here)

worker_processes auto;
events { worker_connections 4096; }

http {
    log_format ratelimit '$remote_addr - [$time_local] "$request" '
                         '$status limit_req=$limit_req_status';
    access_log /var/log/nginx/access.log ratelimit;
    error_log  /var/log/nginx/error.log warn;

    # Deliberately higher than strict-waf so the sustainable ceiling lands in a
    # different band (~360 r/s honored with this burst), giving the union corpus a
    # second, distinct rate-limit operating point.
    limit_req_zone  $binary_remote_addr zone=perip:16m   rate=500r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:16m;
    limit_req_status  429;
    limit_conn_status 503;

    upstream origin { server whoami:80; keepalive 64; }

    server {
        listen 80 default_server;
        server_name _;

        location = /healthz { return 200 "ok\n"; }

        location / {
            # Large burst, nodelay: a leaky bucket that absorbs spikes then hard-
            # caps at the sustained rate. Same treatment for every path/variant.
            limit_req  zone=perip burst=100 nodelay;
            limit_conn connperip 200;
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
