# Rate target: hard cap 150 r/s (nodelay -> reject excess as 429). HOLD-OUT target:
# a ceiling that appears in NO training corpus, used only at evaluation to test that a
# policy trained on {50,100,200} generalizes to an unseen ceiling rather than
# memorizing specific rate values. The honest generalization gate.
worker_processes auto;
events { worker_connections 4096; }

http {
    log_format ratelimit '$remote_addr - "$request" $status limit_req=$limit_req_status';
    access_log /var/log/nginx/access.log ratelimit;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone  $binary_remote_addr zone=perip:16m rate=150r/s;
    limit_req_status 429;

    upstream origin { server origin:80; keepalive 64; }

    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { return 200 "ok\n"; }
        location / {
            limit_req zone=perip burst=30 nodelay;
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
