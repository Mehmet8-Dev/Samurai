# Rate-drop target B: hard cap 50 r/s (nodelay -> reject excess as 429).
# Identical to nginx-r100 except the rate ceiling is halved — the socat shift between
# the two mid-episode is a pure capacity drop (100 -> 50), the regime where a policy
# sitting at the old ceiling must sense the change and re-settle. A recurrent (RL²)
# policy that remembers the drop should re-converge faster than a context-free FF one.
worker_processes auto;
events { worker_connections 4096; }

http {
    log_format ratelimit '$remote_addr - "$request" $status limit_req=$limit_req_status';
    access_log /var/log/nginx/access.log ratelimit;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone  $binary_remote_addr zone=perip:16m rate=50r/s;
    limit_req_status 429;

    upstream origin { server origin:80; keepalive 64; }

    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { return 200 "ok\n"; }
        location / {
            limit_req zone=perip burst=10 nodelay;
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
