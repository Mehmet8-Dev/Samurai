# Compact, self-contained WAF signatures — enough to make the WAF *react* (403)
# to attackish traffic so the corpus captures genuine WAF-block reactions without
# vendoring the full OWASP CRS. Swap in CRS (Include .../crs/rules/*.conf) for
# production-grade coverage.
#
# Each rule denies with 403 (via SecDefaultAction in coraza.conf) and tags the
# reason. A benign load test (GET /) passes through untouched — only requests that
# trip a signature are blocked, exactly like a real WAF.

# --- Path traversal -------------------------------------------------------------
SecRule REQUEST_URI "@rx (?i)(?:\.\./|\.\.\\|%2e%2e%2f|%2e%2e/)" \
    "id:100001,phase:1,t:none,t:urlDecodeUni,msg:'Path traversal',tag:'attack-lfi'"

# --- SQL injection --------------------------------------------------------------
SecRule ARGS "@rx (?i)(?:union\s+select|or\s+1\s*=\s*1|;\s*drop\s+table|sleep\s*\()" \
    "id:100002,phase:2,t:none,t:urlDecodeUni,t:lowercase,msg:'SQL injection',tag:'attack-sqli'"

# --- Cross-site scripting -------------------------------------------------------
SecRule ARGS "@rx (?i)(?:<script|javascript:|onerror\s*=|onload\s*=)" \
    "id:100003,phase:2,t:none,t:urlDecodeUni,t:htmlEntityDecode,msg:'XSS',tag:'attack-xss'"

# --- OS command injection -------------------------------------------------------
SecRule ARGS "@rx (?i)(?:;\s*(?:cat|ls|id|wget|curl|nc)\b|\|\s*(?:sh|bash)\b|`[^`]+`)" \
    "id:100004,phase:2,t:none,t:urlDecodeUni,msg:'Command injection',tag:'attack-rce'"

# --- Known scanner / bad-bot user agents ---------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:sqlmap|nikto|nmap|masscan|dirbuster|nuclei|acunetix)" \
    "id:100005,phase:1,t:none,msg:'Scanner user-agent',tag:'attack-scanner'"
