# Core Coraza engine settings for the lab. Blocking mode, sane request limits.
# This mirrors the essential knobs from the upstream coraza.conf-recommended.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off

# Default action: log and deny with 403 when a blocking rule matches.
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLog /var/log/caddy/coraza-audit.log
SecAuditLogType Serial
