{{- if and .Values.serviceAccount.create .Values.autoscale.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "samurai.fullname" . }}-master-control
  labels:
    app.kubernetes.io/name: {{ include "samurai.name" . }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "samurai.fullname" . }}-master-control
  labels:
    app.kubernetes.io/name: {{ include "samurai.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "samurai.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "samurai.fullname" . }}-master-control
{{- end -}}
