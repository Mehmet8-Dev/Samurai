apiVersion: v1
kind: Service
metadata:
  name: {{ include "samurai.fullname" . }}-master
  labels:
    app.kubernetes.io/name: {{ include "samurai.name" . }}
    app.kubernetes.io/component: master
spec:
  type: {{ .Values.master.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "samurai.name" . }}
    app.kubernetes.io/component: master
  ports:
    - name: grpc
      port: {{ .Values.master.service.port }}
      targetPort: grpc
    - name: mgmt
      port: {{ .Values.master.managementPort }}
      targetPort: mgmt
