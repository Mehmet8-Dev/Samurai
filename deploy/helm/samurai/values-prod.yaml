# Production overrides for the native ZMQ control plane.
# Layer on top of values.yaml: -f values.yaml -f values-prod.yaml

image:
  repository: samurai
  tag: stable
  pullPolicy: IfNotPresent

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "8"
    memory: 16Gi

auth:
  clusterSecret: "__REQUIRED__"
  tenantNamespace: default

# CURVE encryption on in production. Generate once and set both keys (or point
# existingSecret at a pre-provisioned Secret with key `curve_server_secret`).
curve:
  enabled: true
  serverSecret: "__REQUIRED__"
  serverPublic: "__REQUIRED__"

ha:
  enabled: true
  mode: redis
  redis:
    url: redis://redis-master.default.svc.cluster.local:6379/0
    key: samurai:ha:master

master:
  replicas: 3

slave:
  mode: deployment
  replicas: 6
  worker: cpu

autoscale:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  step: 2
  cooldownS: 20
  shardsPerWorker: 4
