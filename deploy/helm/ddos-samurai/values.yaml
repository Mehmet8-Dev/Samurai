image:
  repository: ddos-samurai
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

tls:
  enabled: false
  existingSecret: ""
  mountPath: /etc/ddos-samurai/tls
  certFile: tls.crt
  keyFile: tls.key
  caFile: ca.crt
  clientCaFile: client-ca.crt
  requireClientAuth: true

auth:
  clusterSecret: "change-me"
  management:
    adminToken: "change-me-admin"
    operatorToken: "change-me-operator"
    viewerToken: "change-me-viewer"
  rbac:
    enabled: true
    defaultRole: viewer
    adminSecret: ""
    operatorSecret: ""
    viewerSecret: ""
    workerSecret: ""
  tenantNamespace: default

ha:
  enabled: true
  mode: redis
  nodeId: ""
  waitForLeader: true
  leaseSeconds: 15
  renewIntervalS: 5
  redis:
    url: redis://redis-master.default.svc.cluster.local:6379/0
    key: samurai:ha:master
  etcd:
    endpoints: 127.0.0.1:2379
    key: samurai/ha/master
    timeoutS: 3
  raft:
    listen: 0.0.0.0:7000
    peers: ""
    electionTimeoutMinMs: 900
    electionTimeoutMaxMs: 1500
    heartbeatIntervalMs: 250
    snapshotThreshold: 2048
    snapshotKeepEntries: 512

autoscale:
  enabled: true
  targetKind: deployment
  targetName: ddos-samurai-slave
  minReplicas: 1
  maxReplicas: 20
  step: 1
  cooldownS: 15
  shardsPerWorker: 4
  idleScaleDownS: 60

master:
  replicas: 1
  managementPort: 8089
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    type: ClusterIP
    port: 5099
  extraArgs:
    - --worker-registration-timeout-s
    - "30"
    - --job-timeout-s
    - "120"
    - --target
    - 127.0.0.1
    - --port
    - "80"
    - --protocol
    - tcp
    - --count
    - "100000"
    - --confirm

slave:
  mode: deployment # deployment|daemonset
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  daemonsetUpdateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  extraArgs:
    - --heartbeat-interval-ms
    - "2000"
    - --slave-master-timeout-s
    - "30"
    - --stats-stream-enable

