# DDoSamurai Helm values — native ZMQ control plane.
#
# The image ships the native binaries (samurai_master / samurai_slave + workers)
# on PATH; the workloads select one via args[0] behind tini. Secrets are passed
# through the environment (the daemons read SAMURAI_CLUSTER_SECRET /
# SAMURAI_CURVE_SERVER_SECRET); all other config is inlined into args.

image:
  repository: ddos-samurai
  tag: native
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

auth:
  # Shared cluster secret (app-layer auth on every control message).
  clusterSecret: "__REQUIRED__"
  tenantNamespace: default

# CURVE transport encryption for the master<->slave control channel (native's
# encryption path; there is no mTLS client-cert path in the native daemons).
# Generate a keypair once:
#   docker run --rm ddos-samurai:native samurai_master --gen-curve-keys
# then set serverSecret (kept in the -auth Secret, injected to the master via
# env) and serverPublic (handed to the slaves as a flag; it is not sensitive).
# Disable only for in-cluster plaintext behind a NetworkPolicy / service mesh —
# the master then binds with --insecure-control.
curve:
  enabled: true
  serverSecret: ""
  serverPublic: ""
  # Optionally supply the server secret from an existing Secret (key
  # `curve_server_secret`) instead of serverSecret above.
  existingSecret: ""

region:
  workerRegion: ""
  targetRegion: ""

# HA leader election. Native modes: static | file-lock | redis. Redis is the
# only externally-coordinated backend implemented natively (etcd/raft are not).
ha:
  enabled: true
  mode: redis
  redis:
    url: redis://redis-master.default.svc.cluster.local:6379/0
    key: samurai:ha:master

# Cross-region federation (opt-in). Shares the Redis backend with HA.
multiMaster:
  enabled: false
  regionId: ""
  redis:
    url: redis://redis-master.default.svc.cluster.local:6379/0
  namespace: default
  heartbeatTtlS: 15
  dequeueMax: 3

# Worker autoscale. The master computes desired replicas from live shard load
# and patches the target's scale subresource via the in-cluster service account
# (see master-rbac.yaml). Set rbac.create=false if binding RBAC separately.
autoscale:
  enabled: true
  targetKind: deployment        # deployment | statefulset
  targetName: ddos-samurai-slave
  minReplicas: 1
  maxReplicas: 20
  step: 1
  cooldownS: 15
  shardsPerWorker: 4
  idleScaleDownS: 60
  rbac:
    create: true

master:
  replicas: 1
  managementPort: 8089
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    type: ClusterIP
    port: 5099
  # The job this master runs across the cluster (native samurai_master flags).
  extraArgs:
    - --wait-workers-s
    - "30"
    - --job-timeout-s
    - "120"
    - --target
    - 127.0.0.1
    - --port
    - "80"
    - --protocol
    - tcp
    - --count
    - "100000"

slave:
  mode: deployment      # deployment | daemonset
  replicas: 2
  worker: cpu           # worker flavor this slave runs (or "bundle" for all)
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  daemonsetUpdateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  extraArgs:
    - --heartbeat-interval-ms
    - "2000"
    - --master-timeout-s
    - "30"
