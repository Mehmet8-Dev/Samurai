image:
  repository: ddos-samurai
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

master:
  replicas: 1
  managementPort: 8089
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    type: ClusterIP
    port: 5099
  args:
    - --role
    - master
    - --control-insecure
    - --control-listen
    - 0.0.0.0:5099
    - --management-api-enable
    - --management-api-listen
    - 0.0.0.0:8089
    - --worker-registration-timeout-s
    - "30"
    - --job-timeout-s
    - "120"
    - --target
    - 127.0.0.1
    - --port
    - "80"
    - --protocol
    - tcp
    - --count
    - "100000"
    - --confirm

slave:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  args:
    - --role
    - slave
    - --control-insecure
    - --control-endpoints
    - "{{ .Release.Name }}-master:5099"
    - --control-listen
    - 0.0.0.0:5099
    - --heartbeat-interval-ms
    - "2000"
    - --slave-master-timeout-s
    - "30"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
serviceAccount:
  create: true
  name: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
