apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ddos-samurai.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
data:
  tenant_namespace: {{ .Values.auth.tenantNamespace | quote }}
  worker_region: {{ .Values.region.workerRegion | quote }}
  target_region: {{ .Values.region.targetRegion | quote }}
  region_aware_routing: {{ ternary "true" "false" .Values.region.regionAwareRouting | quote }}
  cross_region_heartbeat_factor: {{ .Values.region.crossRegionHeartbeatFactor | quote }}
  ha_mode: {{ .Values.ha.mode | quote }}
  ha_wait_for_leader: {{ ternary "true" "false" .Values.ha.waitForLeader | quote }}
  ha_lease_seconds: {{ .Values.ha.leaseSeconds | quote }}
  ha_renew_interval_s: {{ .Values.ha.renewIntervalS | quote }}
  ha_redis_url: {{ .Values.ha.redis.url | quote }}
  ha_redis_key: {{ .Values.ha.redis.key | quote }}
  ha_etcd_endpoints: {{ .Values.ha.etcd.endpoints | quote }}
  ha_etcd_key: {{ .Values.ha.etcd.key | quote }}
  ha_etcd_timeout_s: {{ .Values.ha.etcd.timeoutS | quote }}
  ha_raft_listen: {{ .Values.ha.raft.listen | quote }}
  ha_raft_peers: {{ .Values.ha.raft.peers | quote }}
  ha_raft_election_timeout_min_ms: {{ .Values.ha.raft.electionTimeoutMinMs | quote }}
  ha_raft_election_timeout_max_ms: {{ .Values.ha.raft.electionTimeoutMaxMs | quote }}
  ha_raft_heartbeat_interval_ms: {{ .Values.ha.raft.heartbeatIntervalMs | quote }}
  ha_raft_snapshot_threshold: {{ .Values.ha.raft.snapshotThreshold | quote }}
  ha_raft_snapshot_keep_entries: {{ .Values.ha.raft.snapshotKeepEntries | quote }}
  multi_master_enabled: {{ ternary "true" "false" .Values.multiMaster.enabled | quote }}
  multi_master_region_id: {{ default .Values.region.workerRegion .Values.multiMaster.regionId | quote }}
  multi_master_redis_url: {{ .Values.multiMaster.redis.url | quote }}
  multi_master_namespace: {{ .Values.multiMaster.namespace | quote }}
  multi_master_heartbeat_ttl_s: {{ .Values.multiMaster.heartbeatTtlS | quote }}
  multi_master_dequeue_max: {{ .Values.multiMaster.dequeueMax | quote }}
  control_rbac_default_role: {{ .Values.auth.rbac.defaultRole | quote }}
  control_jwt_role_claim: {{ .Values.auth.jwt.roleClaim | quote }}
  control_jwt_tenant_claim: {{ .Values.auth.jwt.tenantClaim | quote }}
  management_api_jwt_role_claim: {{ .Values.auth.jwt.roleClaim | quote }}
  management_api_jwt_tenant_claim: {{ .Values.auth.jwt.tenantClaim | quote }}
  management_api_live_interval_ms: {{ .Values.master.managementLiveIntervalMs | quote }}
  control_tls_watch_files: {{ ternary "true" "false" .Values.master.tlsWatchFiles | quote }}
  control_tls_reload_interval_s: {{ .Values.master.tlsReloadIntervalS | quote }}
  control_rbac_audit_success: {{ ternary "true" "false" .Values.master.rbacAudit.includeSuccess | quote }}
  autoscale_target_kind: {{ .Values.autoscale.targetKind | quote }}
  autoscale_target_name: {{ .Values.autoscale.targetName | quote }}
  autoscale_min_replicas: {{ .Values.autoscale.minReplicas | quote }}
  autoscale_max_replicas: {{ .Values.autoscale.maxReplicas | quote }}
  autoscale_step: {{ .Values.autoscale.step | quote }}
  autoscale_cooldown_s: {{ .Values.autoscale.cooldownS | quote }}
  autoscale_shards_per_worker: {{ .Values.autoscale.shardsPerWorker | quote }}
  autoscale_idle_scale_down_s: {{ .Values.autoscale.idleScaleDownS | quote }}
