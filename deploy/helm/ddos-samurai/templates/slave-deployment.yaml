apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ddos-samurai.fullname" . }}-slave
  labels:
    app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
    app.kubernetes.io/component: slave
spec:
  replicas: {{ .Values.slave.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
      app.kubernetes.io/component: slave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
        app.kubernetes.io/component: slave
    spec:
      containers:
        - name: slave
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
{{- range .Values.slave.args }}
{{- if contains "{{ .Release.Name }}" . }}
            - {{ replace "{{ .Release.Name }}" $.Release.Name . | quote }}
{{- else }}
            - {{ . | quote }}
{{- end }}
{{- end }}
          ports:
            - containerPort: 5099
              name: grpc
          resources:
{{ toYaml .Values.resources | indent 12 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
