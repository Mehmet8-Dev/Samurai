apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ddos-samurai.fullname" . }}-slave
  labels:
    app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
    app.kubernetes.io/component: slave
spec:
  replicas: {{ .Values.slave.replicas }}
  strategy:
{{ toYaml .Values.slave.updateStrategy | indent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
      app.kubernetes.io/component: slave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
        app.kubernetes.io/component: slave
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "ddos-samurai.serviceAccountName" . }}
{{- with .Values.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      containers:
        - name: slave
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          args:
{{- range .Values.slave.args }}
{{- if contains "{{ .Release.Name }}" . }}
            - {{ replace "{{ .Release.Name }}" $.Release.Name . | quote }}
{{- else }}
            - {{ . | quote }}
{{- end }}
{{- end }}
          ports:
            - containerPort: 5099
              name: grpc
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
