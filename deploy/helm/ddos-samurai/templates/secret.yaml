apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddos-samurai.fullname" . }}-auth
  labels:
    app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
type: Opaque
stringData:
  cluster_secret: {{ required "auth.clusterSecret is required" .Values.auth.clusterSecret | quote }}
{{- if and .Values.curve.enabled (not .Values.curve.existingSecret) }}
  # CURVE server secret key (Z85). Generate once with:
  #   docker run --rm <image> samurai_master --gen-curve-keys
  # and set curve.serverSecret / curve.serverPublic (public goes to the slaves).
  curve_server_secret: {{ required "curve.serverSecret is required when curve.enabled and no existingSecret" .Values.curve.serverSecret | quote }}
{{- end }}
