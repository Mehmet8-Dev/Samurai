apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddos-samurai.fullname" . }}-auth
  labels:
    app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
type: Opaque
stringData:
  cluster_secret: {{ .Values.auth.clusterSecret | quote }}
  control_jwt_secret: {{ .Values.auth.jwt.controlSecret | quote }}
  management_jwt_secret: {{ .Values.auth.jwt.managementSecret | quote }}
  management_admin_token: {{ .Values.auth.management.adminToken | quote }}
  management_operator_token: {{ .Values.auth.management.operatorToken | quote }}
  management_viewer_token: {{ .Values.auth.management.viewerToken | quote }}
  rbac_admin_secret: {{ default .Values.auth.clusterSecret .Values.auth.rbac.adminSecret | quote }}
  rbac_operator_secret: {{ default .Values.auth.clusterSecret .Values.auth.rbac.operatorSecret | quote }}
  rbac_viewer_secret: {{ default .Values.auth.clusterSecret .Values.auth.rbac.viewerSecret | quote }}
  rbac_worker_secret: {{ default .Values.auth.clusterSecret .Values.auth.rbac.workerSecret | quote }}
