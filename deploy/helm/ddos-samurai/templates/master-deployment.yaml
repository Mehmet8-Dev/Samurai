apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ddos-samurai.fullname" . }}-master
  labels:
    app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
    app.kubernetes.io/component: master
spec:
  replicas: {{ .Values.master.replicas }}
  strategy:
{{ toYaml .Values.master.updateStrategy | indent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ddos-samurai.name" . }}
        app.kubernetes.io/component: master
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "ddos-samurai.serviceAccountName" . }}
{{- with .Values.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      containers:
        - name: master
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          # Secrets are injected via the environment; the native daemons read
          # SAMURAI_CLUSTER_SECRET / SAMURAI_CURVE_SERVER_SECRET directly (kept
          # off the command line). Non-secret config is inlined into args below.
          env:
            - name: SAMURAI_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddos-samurai.fullname" . }}-auth
                  key: cluster_secret
{{- if .Values.curve.enabled }}
            - name: SAMURAI_CURVE_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.curve.existingSecret | default (printf "%s-auth" (include "ddos-samurai.fullname" .)) }}
                  key: curve_server_secret
{{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # tini (image ENTRYPOINT) runs this; args[0] selects the native binary.
          args:
            - samurai_master
            - --control-listen
            - tcp://0.0.0.0:5099
            - --management-listen
            - 0.0.0.0:{{ .Values.master.managementPort }}
            - --tenant-namespace
            - {{ .Values.auth.tenantNamespace | quote }}
{{- if not .Values.curve.enabled }}
            # Non-loopback control bind without CURVE requires an explicit opt-in.
            - --insecure-control
{{- end }}
{{- if .Values.region.targetRegion }}
            - --target-region
            - {{ .Values.region.targetRegion | quote }}
{{- end }}
{{- if .Values.ha.enabled }}
            - --ha-mode
            - {{ .Values.ha.mode | quote }}
            - --ha-node-id
            - $(POD_NAME)
{{- if eq .Values.ha.mode "redis" }}
            - --ha-lease-key
            - {{ .Values.ha.redis.key | quote }}
{{- if not .Values.multiMaster.enabled }}
            - --multi-master-redis-url
            - {{ .Values.ha.redis.url | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.multiMaster.enabled }}
            - --multi-master-enable
            - --multi-master-region-id
            - {{ default .Values.region.workerRegion .Values.multiMaster.regionId | quote }}
            - --multi-master-redis-url
            - {{ .Values.multiMaster.redis.url | quote }}
            - --multi-master-namespace
            - {{ .Values.multiMaster.namespace | quote }}
            - --multi-master-heartbeat-ttl-s
            - {{ .Values.multiMaster.heartbeatTtlS | quote }}
            - --multi-master-dequeue-max
            - {{ .Values.multiMaster.dequeueMax | quote }}
{{- end }}
{{- if .Values.autoscale.enabled }}
            # The in-cluster service account (master-rbac) is auto-detected for
            # the live scale backend; no --autoscale-k8s-api needed in-cluster.
            - --autoscale-enable
            - --autoscale-target-kind
            - {{ .Values.autoscale.targetKind | quote }}
            - --autoscale-target-name
            - {{ .Values.autoscale.targetName | quote }}
            - --autoscale-namespace
            - {{ .Release.Namespace | quote }}
            - --autoscale-min
            - {{ .Values.autoscale.minReplicas | quote }}
            - --autoscale-max
            - {{ .Values.autoscale.maxReplicas | quote }}
            - --autoscale-step
            - {{ .Values.autoscale.step | quote }}
            - --autoscale-cooldown-s
            - {{ .Values.autoscale.cooldownS | quote }}
            - --autoscale-shards-per-worker
            - {{ .Values.autoscale.shardsPerWorker | quote }}
            - --autoscale-idle-scale-down-s
            - {{ .Values.autoscale.idleScaleDownS | quote }}
{{- end }}
{{- range .Values.master.extraArgs }}
            - {{ . | quote }}
{{- end }}
          ports:
            - containerPort: 5099
              name: control
            - containerPort: {{ .Values.master.managementPort }}
              name: mgmt
          readinessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
