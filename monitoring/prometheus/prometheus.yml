global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    stack: samurai-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: samurai_textfile
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # If the API stack is not running, this target may stay down.
  - job_name: samurai_api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5099", "samurai-api:5099"]
