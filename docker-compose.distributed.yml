# Distributed Samurai Cluster (Native C++17 Master/Slave + Redis HA/Federation)
#
# Quick start:
#   docker compose -f docker-compose.distributed.yml up -d
#   curl -s http://127.0.0.1:8089/healthz
#   docker compose -f docker-compose.distributed.yml logs -f master
#
# Uses the pre-built GHCR image by default; run with `--build` to compile from source.

services:
  redis:
    image: redis:7-alpine
    container_name: samurai-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - samurai-net

  master:
    image: ghcr.io/mehmet8-dev/samurai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samurai-master
    environment:
      SAMURAI_CLUSTER_SECRET: "samurai-cluster-secret"
      SAMURAI_MANAGEMENT_API_ADMIN_TOKEN: "samurai-admin-token"
      SAMURAI_MANAGEMENT_API_OPERATOR_TOKEN: "samurai-operator-token"
      SAMURAI_MANAGEMENT_API_VIEWER_TOKEN: "samurai-viewer-token"
      SAMURAI_TENANT_NAMESPACE: "default"
    command:
      - samurai_master
      - --insecure-control
      - --control-listen
      - tcp://0.0.0.0:5099
      - --management-listen
      - 0.0.0.0:8089
      - --tenant-namespace
      - default
      - --ha-mode
      - redis
      - --ha-lease-key
      - samurai:ha:master
      - --ha-node-id
      - master-1
      - --multi-master-enable
      - --multi-master-region-id
      - eu-central
      - --multi-master-redis-url
      - redis://redis:6379/0
      - --multi-master-namespace
      - compose-demo
      - --expect-workers
      - "2"
      - --wait-workers-s
      - "30"
      - --worker
      - cpu
      - --target
      - 127.0.0.1
      - --port
      - "80"
      - --protocol
      - udp
      - --count
      - "0"
    ports:
      - "5099:5099"
      - "8089:8089"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - samurai-net

  slave:
    image: ghcr.io/mehmet8-dev/samurai:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SAMURAI_CLUSTER_SECRET: "samurai-cluster-secret"
      SAMURAI_TENANT_NAMESPACE: "default"
    command:
      - samurai_slave
      - --control-endpoints
      - master:5099
      - --dispatch-mode
      - reverse
      - --worker
      - bundle
      - --worker-dir
      - /usr/local/bin
      - --worker-region
      - eu-central
      - --tenant-namespace
      - default
      - --heartbeat-interval-ms
      - "2000"
      - --master-timeout-s
      - "30"
    depends_on:
      master:
        condition: service_healthy
    networks:
      - samurai-net
    deploy:
      replicas: 2
    restart: unless-stopped

networks:
  samurai-net:
    driver: bridge
