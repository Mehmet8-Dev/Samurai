name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-guard:
    name: SemVer Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate package version and tag alignment
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import pathlib
          import re
          import subprocess
          import sys

          init_path = pathlib.Path("ddos_samurai/__init__.py")
          content = init_path.read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', content, flags=re.MULTILINE)
          if not match:
              print("Could not parse __version__ from ddos_samurai/__init__.py")
              sys.exit(1)

          version = str(match.group(1)).strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"Invalid package SemVer version: {version}")
              sys.exit(1)

          ref = os.getenv("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.split("/")[-1]
              expected = f"v{version}"
              if tag != expected:
                  print(f"Tag/version mismatch: tag={tag}, expected={expected}")
                  sys.exit(1)

          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          base_ref = os.getenv("GITHUB_BASE_REF", "")
          if event_name == "pull_request" and base_ref:
              try:
                  base_content = subprocess.check_output(
                      ["git", "show", f"origin/{base_ref}:ddos_samurai/__init__.py"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  base_match = re.search(r'^__version__\s*=\s*"([^"]+)"', base_content, flags=re.MULTILINE)
                  if base_match and re.fullmatch(r"\d+\.\d+\.\d+", base_match.group(1).strip()):
                      base_version = tuple(int(x) for x in base_match.group(1).strip().split("."))
                      head_version = tuple(int(x) for x in version.split("."))
                      if head_version < base_version:
                          print(
                              "Version regression detected: "
                              f"base={base_match.group(1).strip()} head={version}"
                          )
                          sys.exit(1)
              except subprocess.CalledProcessError:
                  print(f"Warning: could not resolve base version from origin/{base_ref}; skipping regression check.")

          print(f"SemVer guard OK: {version}")
          PY

  backend-tests:
    name: Backend Tests (Python 3.11)
    needs: semver-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SAMURAI_TEST_PROFILE: "ci_safe"
      SAMURAI_QUIC_BUILD_MODE: "native_required"
      SAMURAI_RFC_REPORT_OUT: "${{ github.workspace }}/artifacts"
      SAMURAI_BENCH_BASELINE: "${{ github.workspace }}/benchmarks/benchmark_baseline_ci.json"
      SAMURAI_BENCH_UPDATE_BASELINE: "0"
      SAMURAI_BENCH_REPORT_OUT: "${{ github.workspace }}/artifacts/benchmark_summary.json"
      SAMURAI_PARITY_PROFILE: "ci_safe"
      SAMURAI_SKIP_CUDA_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            setup.py
            requirements.txt
            ddos_samurai/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libssl-dev openssl \
            libgnutls28-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest PyYAML requests aiohttp websockets "httpx[http2]" rich colorama psutil

      - name: Build C extensions (smoke)
        run: python setup.py build_ext --inplace

      - name: Verify benchmark baseline exists
        run: test -f benchmarks/benchmark_baseline_ci.json

      - name: Run backend test suite
        run: |
          mkdir -p artifacts
          pytest tests -q -rs

      - name: RFC Gate
        run: |
          python tests/test_rfc_gate_ci.py --report artifacts/rfc_negative_report.json --min-score 100

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: artifacts/*.json
          if-no-files-found: ignore

  scenario-benchmark-memory:
    name: Scenario Benchmark + Memory Profile (CI smoke)
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SAMURAI_SKIP_CUDA_BUILD: "1"
      SAMURAI_RUN_SCENARIO_BENCH: "1"
      SAMURAI_BENCH_VUS: "100000"
      SAMURAI_BENCH_WORKERS: "16"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            setup.py
            requirements.txt
            ddos_samurai/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libssl-dev openssl \
            libgnutls28-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest PyYAML requests aiohttp websockets "httpx[http2]" rich colorama psutil

      - name: Build C extensions
        run: python setup.py build_ext --inplace

      - name: Run scenario benchmark smoke tests
        run: |
          mkdir -p artifacts
          pytest tests/test_scenario_native_benchmark.py tests/test_scenario_memory_profile_report.py -q -rs

      - name: Generate scenario benchmark + memory artifacts
        run: |
          python - <<'PY'
          from ddos_samurai.scenario_engine import (
              load_scenario_spec,
              run_compile_benchmark,
              write_compile_benchmark_report,
              write_memory_profile_report,
          )
          spec = load_scenario_spec("docs/scenario_web_mobile.yaml")
          report = run_compile_benchmark(spec, scales=[10_000, 100_000], workers=16, seed=1337)
          write_compile_benchmark_report(report, "artifacts/scenario_benchmark_ci.json")
          write_memory_profile_report(report, "artifacts/scenario_memory_profile_ci.md")
          PY

      - name: Upload scenario benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-benchmark-memory-reports
          path: |
            artifacts/scenario_benchmark_ci.json
            artifacts/scenario_memory_profile_ci.md
          if-no-files-found: error
