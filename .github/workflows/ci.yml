name: CI

on:
  push:
    branches: [ main, architecture/refactor, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-guard:
    name: SemVer Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate package version and tag alignment
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import pathlib
          import re
          import subprocess
          import sys

          init_path = pathlib.Path("samurai/__init__.py")
          if not init_path.exists():
              print("samurai/__init__.py does not exist")
              sys.exit(1)
          content = init_path.read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', content, flags=re.MULTILINE)
          if not match:
              print("Could not parse __version__ from samurai/__init__.py")
              sys.exit(1)

          version = str(match.group(1)).strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"Invalid package SemVer version: {version}")
              sys.exit(1)

          ref = os.getenv("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.split("/")[-1]
              expected = f"v{version}"
              if tag != expected:
                  print(f"Tag/version mismatch: tag={tag}, expected={expected}")
                  sys.exit(1)

          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          base_ref = os.getenv("GITHUB_BASE_REF", "")
          if event_name == "pull_request" and base_ref:
              try:
                  base_content = subprocess.check_output(
                      ["git", "show", f"origin/{base_ref}:samurai/__init__.py"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  base_match = re.search(r'^__version__\s*=\s*"([^"]+)"', base_content, flags=re.MULTILINE)
                  if base_match and re.fullmatch(r"\d+\.\d+\.\d+", base_match.group(1).strip()):
                      base_version = tuple(int(x) for x in base_match.group(1).strip().split("."))
                      head_version = tuple(int(x) for x in version.split("."))
                      if head_version < base_version:
                          print(
                              "Version regression detected: "
                              f"base={base_match.group(1).strip()} head={version}"
                          )
                          sys.exit(1)
              except subprocess.CalledProcessError:
                  print(f"Warning: could not resolve base version from origin/{base_ref}; skipping regression check.")

          print(f"SemVer guard OK: {version}")
          PY

  native-build-and-selftest:
    name: Native C++ Build & E2E Selftests
    needs: semver-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev openssl libzmq3-dev cppzmq-dev \
            libhiredis-dev libpcap-dev libbpf-dev libelf-dev clang \
            libnghttp2-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev liburing-dev \
            python3-dev python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies for H2/H3 servers
        run: |
          python -m pip install --upgrade pip
          python -m pip install h2 aioquic cryptography

      - name: Configure and build native targets via CMake
        run: |
          cmake -B build -S samurai -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Build AF_XDP and pacing extensions
        run: |
          make -C samurai all || make -C samurai xdp pacing

      - name: Run Core, Control & MCP Selftests
        run: |
          ./build/control/samurai_control_selftest
          ./build/mcp/test_samurai_mcp

      - name: Run L4 Sliding Window & Fastpath Tests
        run: |
          ./build/l4/test_tcp_sliding_window
          ./build/zmq/test_sharded_fastpath
          ./build/zmq/test_stateful_fastpath
          ./build/zmq/test_stateful_fastpath_l7

      - name: Run L7 Native & ASTF Tests
        run: |
          ./build/l7_emu_native/test_kernel_threaded_l7
          ./build/l7_emu_native/test_l2l3_astf
          ./build/l7_emu_native/test_kernel_threaded_io_uring

      - name: Run E2E HTTP/2 Matrix (io_uring, epoll, TLS, kTLS)
        run: |
          ./samurai/l7_emu_native/run_kernel_threaded_h2_e2e.sh ./build/l7_emu_native/test_kernel_threaded_h2

      - name: Run E2E HTTP/3 QUIC (Threaded & Serial)
        run: |
          ./samurai/l7_emu_native/run_kernel_threaded_h3_e2e.sh ./build/l7_emu_native/test_kernel_threaded_h3

      - name: Run CLI RFC Benchmark Suite (Live Loopback L7)
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import http.server, socketserver, subprocess, sys, threading

          class OkHandler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              disable_nagle_algorithm = True
              def do_GET(self):
                  body = b"ok\n"
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Connection", "keep-alive")
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass

          class ReusableServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
              daemon_threads = True
              allow_reuse_address = True

          srv = ReusableServer(("127.0.0.1", 0), OkHandler)
          port = srv.server_address[1]
          t = threading.Thread(target=srv.serve_forever, daemon=True)
          t.start()
          try:
              rc = subprocess.call([
                  "./build/cli/samurai",
                  "--run-rfc-suite", "all",
                  "--worker", "l7",
                  "--protocol", "http1",
                  "--keepalive",
                  "--concurrency", "4",
                  "--target", "127.0.0.1",
                  "--port", str(port),
                  "--rps", "200",
                  "--count", "40",
                  "--confirm",
                  "--rfc-report-out", "artifacts/rfc_benchmark.html",
              ])
              sys.exit(rc)
          finally:
              srv.shutdown()
              srv.server_close()
          PY

      - name: Upload RFC & Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-benchmark-reports
          path: artifacts/*
          if-no-files-found: ignore

  python-tests:
    name: Python Test Suite (101 Tests)
    needs: native-build-and-selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev openssl libzmq3-dev cppzmq-dev \
            libhiredis-dev libpcap-dev libbpf-dev libelf-dev clang \
            libnghttp2-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev liburing-dev \
            python3-dev python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build native layer required by Python tests
        run: |
          cmake -B build -S samurai -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          make -C samurai all || make -C samurai xdp pacing

      - name: Install Python package in editable mode
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest PyYAML psutil "httpx[http2]" aioquic h2 cryptography numpy

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

  docker-and-helm-smoke:
    name: Docker & Helm Deployment Smoke
    needs: semver-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Verify Helm chart linting
        run: |
          helm lint deploy/helm/samurai

      - name: Verify Helm template generation
        run: |
          helm template test-release deploy/helm/samurai > /tmp/samurai-rendered.yaml
          test -s /tmp/samurai-rendered.yaml
          helm template test-release deploy/helm/samurai -f deploy/helm/samurai/values-prod.yaml > /tmp/samurai-prod-rendered.yaml
          test -s /tmp/samurai-prod-rendered.yaml

      - name: Validate distributed compose file
        run: |
          docker compose -f docker-compose.distributed.yml config > /tmp/compose-validated.yaml
          test -s /tmp/compose-validated.yaml

      - name: Build Native Docker image
        run: |
          docker build -f Dockerfile --build-arg SAMURAI_NATIVE_ARCH=OFF -t samurai:ci .

      - name: Container Smoke Check (samurai_master help)
        run: |
          docker run --rm samurai:ci samurai_master --help
          docker run --rm samurai:ci samurai_slave --help

      - name: Build Source-Runtime Docker image (uncompiled GHCR target)
        run: |
          docker build -f Dockerfile --target source-runtime -t samurai:source-ci .
          docker run --rm -e SAMURAI_SKIP_BUILD=1 samurai:source-ci test -f /opt/samurai/src/samurai/CMakeLists.txt
          docker run --rm -e SAMURAI_SKIP_BUILD=1 samurai:source-ci bash -n /usr/local/bin/samurai-entrypoint.sh
