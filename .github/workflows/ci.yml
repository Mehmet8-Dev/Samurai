name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SAMURAI_TEST_PROFILE: "ci_safe"
      SAMURAI_QUIC_BUILD_MODE: "native_required"
      SAMURAI_RFC_REPORT_OUT: "${{ github.workspace }}/artifacts"
      SAMURAI_BENCH_BASELINE: "${{ github.workspace }}/benchmarks/benchmark_baseline_ci.json"
      SAMURAI_BENCH_UPDATE_BASELINE: "0"
      SAMURAI_BENCH_REPORT_OUT: "${{ github.workspace }}/artifacts/benchmark_summary.json"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            setup.py
            requirements.txt
            ddos_samurai/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libssl-dev openssl \
            libgnutls28-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest PyYAML requests aiohttp websockets aioquic "httpx[http2]" rich colorama psutil

      - name: Build C extensions (smoke)
        run: python setup.py build_ext --inplace

      - name: Verify benchmark baseline exists
        run: test -f benchmarks/benchmark_baseline_ci.json

      - name: Run backend test suite
        run: |
          mkdir -p artifacts
          pytest tests -q -rs

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: artifacts/*.json
          if-no-files-found: ignore

  dashboard-tests:
    name: Dashboard Tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run dashboard tests
        run: npm run test -- --run
