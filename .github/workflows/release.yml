name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      resolved_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-and-certify:
    name: Build Native Release & Certify
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev openssl libzmq3-dev cppzmq-dev \
            libhiredis-dev libpcap-dev libbpf-dev libelf-dev clang \
            libnghttp2-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev liburing-dev \
            python3-dev python3-pip

      - name: Build Release Binaries via CMake
        run: |
          cmake -B build -S samurai -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Certify Release via Selftests
        run: |
          ./build/control/samurai_control_selftest
          ./build/l4/test_tcp_sliding_window
          ./build/l7_emu_native/test_kernel_threaded_l7
          ./build/l7_emu_native/test_l2l3_astf

      - name: Package Release Tarball
        run: |
          TAG="${{ needs.validate-tag.outputs.resolved_tag }}"
          DIST_DIR="samurai-${TAG}-linux-x86_64"
          mkdir -p "${DIST_DIR}/bin"
          cp build/cli/samurai "${DIST_DIR}/bin/"
          cp build/control/daemon/samurai_master "${DIST_DIR}/bin/"
          cp build/control/daemon/samurai_slave "${DIST_DIR}/bin/"
          cp build/zmq/samurai_*_worker "${DIST_DIR}/bin/" || true
          cp README.md LICENSE* "${DIST_DIR}/" 2>/dev/null || true
          tar -czvf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Build Docker Production Image
        run: |
          docker build -f Dockerfile -t "samurai:${{ needs.validate-tag.outputs.resolved_tag }}" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.resolved_tag }}
          files: |
            samurai-${{ needs.validate-tag.outputs.resolved_tag }}-linux-x86_64.tar.gz
            samurai-${{ needs.validate-tag.outputs.resolved_tag }}-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          make_latest: true
