name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v2.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-24.04
    outputs:
      resolved_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-and-certify:
    name: Build Native Release & Certify
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev openssl libzmq3-dev cppzmq-dev \
            libhiredis-dev libpcap-dev libbpf-dev libelf-dev clang \
            libnghttp2-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev liburing-dev \
            python3-dev python3-pip

      - name: Build Release Binaries via CMake
        run: |
          cmake -B build -S samurai -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Certify Release via Selftests
        run: |
          ./build/control/samurai_control_selftest
          ./build/mcp/test_samurai_mcp
          ./build/l4/test_tcp_sliding_window
          ./build/l7_emu_native/test_kernel_threaded_l7
          ./build/l7_emu_native/test_l2l3_astf

      - name: Package Release Tarball
        run: |
          TAG="${{ needs.validate-tag.outputs.resolved_tag }}"
          DIST_DIR="samurai-${TAG}-linux-x86_64"
          mkdir -p "${DIST_DIR}/bin"
          cp build/cli/samurai "${DIST_DIR}/bin/"
          cp build/mcp/samurai_mcp "${DIST_DIR}/bin/"
          cp build/control/daemon/samurai_master "${DIST_DIR}/bin/"
          cp build/control/daemon/samurai_slave "${DIST_DIR}/bin/"
          cp build/zmq/samurai_*_worker "${DIST_DIR}/bin/" || true
          cp build/l4/test_100k_tcp_flows "${DIST_DIR}/bin/samurai_bench_100k_tcp"
          cp build/l4/test_1m_tcp_flows "${DIST_DIR}/bin/samurai_bench_1m_tcp"
          cp build/zmq/bench_l7_stateful_userspace "${DIST_DIR}/bin/samurai_bench_l7"
          cp -r skills "${DIST_DIR}/skills"
          cp README.md LICENSE* "${DIST_DIR}/" 2>/dev/null || true
          tar -czvf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Build and Push Uncompiled Source Docker Image to GHCR
        run: |
          TAG="${{ needs.validate-tag.outputs.resolved_tag }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/samurai"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Package toolchain + source only (target=source-runtime): zero C++ binaries compiled on GitHub Actions.
          # On first user run, samurai-entrypoint.sh compiles natively for the host machine (SAMURAI_NATIVE_ARCH=ON).
          docker build -f Dockerfile --target source-runtime -t "${IMAGE_LOWER}:${TAG}" -t "${IMAGE_LOWER}:latest" .
          docker push "${IMAGE_LOWER}:${TAG}"
          docker push "${IMAGE_LOWER}:latest"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.resolved_tag }}
          files: |
            samurai-${{ needs.validate-tag.outputs.resolved_tag }}-linux-x86_64.tar.gz
            samurai-${{ needs.validate-tag.outputs.resolved_tag }}-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          make_latest: true

  publish-npm:
    name: Publish samurai-net to npm
    needs: [validate-tag, build-and-certify]
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify samurai-net launcher tests
        run: |
          cd npm && npm test

      - name: Publish samurai-net
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG_VER="${{ needs.validate-tag.outputs.resolved_tag }}"
          TAG_VER="${TAG_VER#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('npm/package.json','utf8'));if(p.version!=='${TAG_VER}'){console.error('npm version mismatch:',p.version,'!=','${TAG_VER}');process.exit(1);}"
          cd npm && npm publish --access public
