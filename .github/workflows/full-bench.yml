name: Full Bench (Manual)

on:
  workflow_dispatch:
    inputs:
      test_profile:
        description: "Benchmark test profile (ci_safe | full)"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - ci_safe

permissions:
  contents: write

concurrency:
  group: full-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-bench:
    name: Full RFC & Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev openssl libzmq3-dev cppzmq-dev \
            libhiredis-dev libpcap-dev libbpf-dev libelf-dev clang \
            libnghttp2-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev liburing-dev \
            python3-dev python3-pip

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest aioquic h2 cryptography psutil numpy

      - name: Build Native Binaries and Workers via CMake
        run: |
          cmake -B build -S samurai -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Build AF_XDP and pacing extensions
        run: |
          make -C samurai all || make -C samurai xdp pacing

      - name: Execute Native Benchmarks
        run: |
          mkdir -p artifacts
          echo "=== 1. RFC 2544 / 3511 / 8219 Benchmark Suite ==="
          ./build/cli/samurai --run-rfc-suite all --rfc-report-out artifacts/rfc_benchmark.html

          echo "=== 2. L7 io_uring Reactor Performance ==="
          ./build/l7_emu_native/test_kernel_threaded_io_uring

          echo "=== 3. ASTF L2/L3 Topology Benchmark ==="
          ./build/l7_emu_native/test_l2l3_astf

          echo "=== 4. L4 Stateful Fastpath & Sliding Window ==="
          ./build/l4/test_tcp_sliding_window
          ./build/zmq/test_sharded_fastpath
          ./build/zmq/test_stateful_fastpath
          ./build/zmq/test_stateful_fastpath_l7

          echo "=== 5. HTTP/2 and HTTP/3 E2E Matrix ==="
          ./samurai/l7_emu_native/run_kernel_threaded_h2_e2e.sh ./build/l7_emu_native/test_kernel_threaded_h2
          ./samurai/l7_emu_native/run_kernel_threaded_h3_e2e.sh ./build/l7_emu_native/test_kernel_threaded_h3

      - name: Upload Benchmark Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-benchmark-reports
          path: artifacts/*
          if-no-files-found: ignore
