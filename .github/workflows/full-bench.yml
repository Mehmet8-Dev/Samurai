name: Full Bench (Manual)

on:
  workflow_dispatch:
    inputs:
      run_root:
        description: "Run privileged benchmark tests with sudo"
        required: true
        default: false
        type: boolean
      update_baseline:
        description: "Update benchmark baseline artifact from current run"
        required: true
        default: false
        type: boolean

concurrency:
  group: full-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-bench:
    name: Full RFC + Benchmark (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SAMURAI_TEST_PROFILE: "full"
      SAMURAI_RFC_REPORT_OUT: "${{ github.workspace }}/artifacts"
      SAMURAI_BENCH_BASELINE: "${{ github.workspace }}/artifacts/benchmark_baseline.json"
      SAMURAI_BENCH_UPDATE_BASELINE: "${{ inputs.update_baseline }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            setup.py
            requirements.txt
            ddos_samurai/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest PyYAML requests aiohttp websockets aioquic "httpx[http2]" rich colorama psutil

      - name: Build C extensions
        run: python setup.py build_ext --inplace

      - name: RFC Positive + Negative
        run: |
          mkdir -p artifacts
          pytest tests/test_rfc_compliance.py tests/test_rfc_negative.py -q -rs

      - name: CI-safe Benchmark Summary
        run: |
          SAMURAI_BENCH_REPORT_OUT="${{ github.workspace }}/artifacts/benchmark_summary_ci.json" \
          pytest tests/test_benchmark_ci.py -q -rs

      - name: Full Benchmark Summary
        run: |
          if [ "${{ inputs.run_root }}" = "true" ]; then
            sudo -E env \
              SAMURAI_TEST_PROFILE=full \
              SAMURAI_BENCH_REPORT_OUT="${{ github.workspace }}/artifacts/benchmark_summary_full.json" \
              pytest tests/test_benchmark_full.py tests/test_pacing_root.py -q -rs
          else
            SAMURAI_BENCH_REPORT_OUT="${{ github.workspace }}/artifacts/benchmark_summary_full.json" \
            pytest tests/test_benchmark_full.py tests/test_pacing_root.py -q -rs
          fi

      - name: Upload full benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-benchmark-reports
          path: artifacts/*.json
          if-no-files-found: ignore
