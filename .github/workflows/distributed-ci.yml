name: Distributed CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ddos_samurai/control/**'
      - 'ddos_samurai/zmq_*.py'
      - 'ddos_samurai/zmq_worker_prototype.py'
      - 'ddos_samurai/zmq_wire.py'
      - 'src/daemon/**'
      - 'src/lib/**'
      - 'src/CMakeLists.txt'
      - 'tests/test_distributed*'
      - 'tests/test_zmq_m3_workers.py'
      - 'tests/test_zmq_m4_orchestrator.py'
      - 'tests/test_control_init.py'
      - 'setup.py'
      - '.github/workflows/distributed-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ddos_samurai/control/**'
      - 'ddos_samurai/zmq_*.py'
      - 'ddos_samurai/zmq_worker_prototype.py'
      - 'ddos_samurai/zmq_wire.py'
      - 'src/daemon/**'
      - 'src/lib/**'
      - 'src/CMakeLists.txt'
      - 'tests/test_distributed*'
      - 'tests/test_zmq_m3_workers.py'
      - 'tests/test_zmq_m4_orchestrator.py'
      - 'tests/test_control_init.py'
      - 'setup.py'
      - '.github/workflows/distributed-ci.yml'
  workflow_dispatch:

jobs:
  distributed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SAMURAI_TEST_PROFILE: "ci_safe"
      SAMURAI_SENDER_FALLBACK_POLICY: "fail"
      SAMURAI_L7_FALLBACK_POLICY: "fail"
      SAMURAI_BENCH_UPDATE_BASELINE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"
          cache-dependency-path: |
            setup.py
            requirements.txt
            ddos_samurai/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libssl-dev openssl \
            libgnutls28-dev libngtcp2-dev libnghttp3-dev libngtcp2-crypto-gnutls-dev pkg-config \
            libzmq3-dev cppzmq-dev cmake build-essential

      - name: Install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[distributed]'
          python -m pip install pytest PyYAML "httpx[http2]" pipdeptree

      - name: Dependency tree integrity
        run: |
          python -m pip check
          python -m pipdeptree --warn fail > /tmp/dependency_tree.txt
          test -s /tmp/dependency_tree.txt

      - name: Build C extensions
        run: python setup.py build_ext --inplace

      - name: Build ZMQ worker binaries
        run: |
          cmake -S src -B build-workers
          cmake --build build-workers -j"$(nproc)"

      - name: Verify Helm chart
        run: |
          bash tools/verify_helm.sh deploy/helm/ddos-samurai samurai

      - name: Validate distributed compose
        run: |
          docker compose -f docker-compose.distributed.yml config > /tmp/ddos-samurai-compose.yaml
          test -s /tmp/ddos-samurai-compose.yaml

      - name: Build production image
        run: |
          docker build -f Dockerfile.prod -t ddos-samurai:distributed-ci .

      - name: Run distributed suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q -rs \
            tests/test_distributed_args.py \
            tests/test_distributed_auth.py \
            tests/test_distributed_autoscale.py \
            tests/test_distributed_chaos_suite.py \
            tests/test_distributed_client_retry.py \
            tests/test_distributed_e2e_timeout.py \
            tests/test_distributed_failover_redis.py \
            tests/test_distributed_ha.py \
            tests/test_distributed_integration.py \
            tests/test_distributed_jwt.py \
            tests/test_distributed_management_api.py \
            tests/test_distributed_master_observability.py \
            tests/test_distributed_master_queue.py \
            tests/test_distributed_multimaster.py \
            tests/test_distributed_rbac.py \
            tests/test_distributed_rbac_audit.py \
            tests/test_distributed_server_epoch.py \
            tests/test_distributed_slave_zmq_bridge.py \
            tests/test_distributed_telemetry.py \
            tests/test_distributed_tenant.py \
            tests/test_distributed_tls_rotation.py \
            tests/test_control_init.py \
            tests/test_zmq_m3_workers.py \
            tests/test_zmq_m4_orchestrator.py

      - name: Upload dependency tree report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-dependency-tree
          path: /tmp/dependency_tree.txt
          if-no-files-found: ignore
