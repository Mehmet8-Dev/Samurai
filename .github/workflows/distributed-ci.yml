name: Distributed CI

on:
  push:
    branches: [ main, architecture/refactor, "claude/**" ]
    paths:
      - 'ddos_samurai/control/**'
      - 'ddos_samurai/zmq/**'
      - 'deploy/**'
      - 'tests/test_control*'
      - 'tests/test_audit*'
      - 'tests/test_dataplane*'
      - '.github/workflows/distributed-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ddos_samurai/control/**'
      - 'ddos_samurai/zmq/**'
      - 'deploy/**'
      - 'tests/test_control*'
      - 'tests/test_audit*'
      - 'tests/test_dataplane*'
      - '.github/workflows/distributed-ci.yml'
  workflow_dispatch:

concurrency:
  group: distributed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distributed-native-cluster:
    name: Distributed Cluster & Fault Tolerance E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev openssl libzmq3-dev cppzmq-dev \
            libhiredis-dev libpcap-dev libbpf-dev libelf-dev clang \
            python3-dev python3-pip curl jq

      - name: Build Native Daemons and Workers
        run: |
          cmake -B build -S ddos_samurai -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target \
            samurai_control_selftest \
            samurai_master \
            samurai_slave \
            samurai_cpu_worker \
            samurai_l7_worker

      - name: Run Control Plane Selftest (375 checks)
        run: |
          ./build/control/samurai_control_selftest

      - name: Run Live Cluster Integration & Management API Test
        run: |
          set -e
          echo "=== Starting samurai_master on 5099, Management API on 5591 ==="
          ./build/control/daemon/samurai_master \
            --count 1000 \
            --target 127.0.0.1 \
            --port 9999 \
            --control-listen tcp://127.0.0.1:5099 \
            --management-listen 127.0.0.1:5591 \
            --agent-join-token ci-agent-token \
            --agent-artifact-dir build/zmq \
            --expect-workers 2 \
            --wait-workers-s 15 \
            --worker cpu \
            --shard-unit-count 100 \
            --poll-interval-ms 100 > /tmp/master.log 2>&1 &
          MASTER_PID=$!
          sleep 1

          echo "=== Validating Management API Endpoints ==="
          HEALTH=$(curl -sf http://127.0.0.1:5591/healthz)
          echo "Healthz: $HEALTH"

          SUMMARY=$(curl -sf http://127.0.0.1:5591/v1/cluster/summary)
          echo "Summary: $SUMMARY"

          echo "=== Validating Zero-Install Agent Script ==="
          INSTALL_SCRIPT=$(curl -sf "http://127.0.0.1:5591/v1/agent/install?token=ci-agent-token")
          echo "$INSTALL_SCRIPT" | head -n 10

          echo "=== Starting slave-1 and slave-2 in reverse pull mode ==="
          ./build/control/daemon/samurai_slave \
            --control-endpoints 127.0.0.1:5099 \
            --worker-id slave-1 \
            --worker cpu \
            --worker-dir build/zmq \
            --dispatch-mode reverse \
            --heartbeat-interval-ms 200 > /tmp/slave_1.log 2>&1 &
          SLAVE_1_PID=$!

          ./build/control/daemon/samurai_slave \
            --control-endpoints 127.0.0.1:5099 \
            --worker-id slave-2 \
            --worker cpu \
            --worker-dir build/zmq \
            --dispatch-mode reverse \
            --heartbeat-interval-ms 200 > /tmp/slave_2.log 2>&1 &
          SLAVE_2_PID=$!

          sleep 0.5
          echo "=== Checking Registered Workers in Management API ==="
          WORKERS=$(curl -sf http://127.0.0.1:5591/v1/cluster/workers)
          echo "Workers: $WORKERS"

          echo "=== Simulating Worker Crash: kill -9 slave-1 ==="
          kill -9 $SLAVE_1_PID
          echo "slave-1 terminated!"

          echo "=== Waiting for Master to complete remaining shards on slave-2 ==="
          wait $MASTER_PID
          echo "Master finished cleanly with exit code 0!"

          kill -9 $SLAVE_2_PID 2>/dev/null || true
          cat /tmp/master.log

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Package & Run Control Maturation Tests
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest psutil httpx
          pytest -v tests/test_control_plane_maturation.py tests/test_audit_telemetry_maturation.py
