name: Distributed CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ddos_samurai/control/**'
      - 'tests/test_distributed*'
      - 'tests/test_control_init.py'
      - 'setup.py'
      - '.github/workflows/distributed-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ddos_samurai/control/**'
      - 'tests/test_distributed*'
      - 'tests/test_control_init.py'
      - 'setup.py'
      - '.github/workflows/distributed-ci.yml'
  workflow_dispatch:

jobs:
  distributed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[distributed]'
          python -m pip install pytest PyYAML

      - name: Verify Helm chart
        run: |
          bash tools/verify_helm.sh deploy/helm/ddos-samurai samurai

      - name: Validate distributed compose
        run: |
          docker compose -f docker-compose.distributed.yml config > /tmp/ddos-samurai-compose.yaml
          test -s /tmp/ddos-samurai-compose.yaml

      - name: Build production image
        run: |
          docker build -f Dockerfile.prod -t ddos-samurai:distributed-ci .

      - name: Run distributed suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_distributed_args.py \
                 tests/test_distributed_multimaster.py \
                 tests/test_distributed_e2e_timeout.py \
                 tests/test_distributed_integration.py \
                 tests/test_distributed_master_queue.py \
                 tests/test_distributed_tls_rotation.py \
                 tests/test_distributed_telemetry.py \
                 tests/test_distributed_rbac_audit.py \
                 tests/test_distributed_tenant.py \
                 tests/test_distributed_jwt.py \
                 tests/test_distributed_management_api.py \
                 tests/test_control_init.py -q -rs
